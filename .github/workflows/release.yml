# Promote half of the build-once-promote release architecture.
#
# Pushing a `v*` tag (or dispatching this workflow with an existing tag)
# releases that commit to the configured server platform:
#
#   resolve   — pin the tag to a commit, require it to be on main with a green
#               CI run, and resolve an existing immutable registry manifest
#   promote   — stamp the prebuilt platform-specific sha image with a matching
#               platform-specific version image tag
#               (`buildx imagetools create` — a manifest copy, no rebuild), so
#               the deployed artifact is byte-identical to what CI validated
#   deploy    — stage the tagged repo through the server ForceCommand protocol,
#               then use the persistent locked launcher
#               to activate it and run release-deploy.sh: DB backup → migrate → start the
#               standby color → health gate → switch → public smoke test,
#               with automatic rollback if the new version fails
#   publish   — GitHub Release with generated notes (tag pushes only)
#   notify    — Discord, success or failure, always
#
# Rollback / redeploy: run this workflow manually with a tag whose
# RELEASE_RUNTIME_COMPATIBILITY meets the trusted main contract. Pre-contract
# tags require restoring their matching host/database backup instead.
# `downtime: true` switches the server script to
# stop-first mode for migrations that are not backward-compatible.
#
# One-time setup (repo Settings) is documented in DEPLOY.md §6:
#   secrets: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS (required), DISCORD_WEBHOOK_URL
#   variables: DEPLOY_HOST, DEPLOY_USER (default ubuntu), DEPLOY_PATH (default circle_be)

name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Compatible v* tag to (re)deploy; pre-runtime-contract tags are rejected"
        required: true
        type: string
      downtime:
        description: "Stop the old version before migrating (breaking migrations only)"
        type: boolean
        default: false
      irreversible_migration:
        description: "Confirm this release crosses the old-binary rollback boundary"
        type: boolean
        default: false
      force:
        description: "Skip the CI-green check (e.g. redeploying an old tag whose runs expired)"
        type: boolean
        default: false

# Never cancel a release mid-deploy when another tag lands; queue it instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    name: "Resolve & verify release"
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # list CI runs for the tagged commit
      packages: read # probe GHCR for the prebuilt sha image
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      main_sha: ${{ steps.verify.outputs.main_sha }}
      sha_image: ${{ steps.image.outputs.sha_image }}
      release_image: ${{ steps.image.outputs.release_image }}
      digest: ${{ steps.image.outputs.digest }}
      image_ref: ${{ steps.image.outputs.image_ref }}
      needs_promotion: ${{ steps.image.outputs.needs_promotion }}
      legacy_release_image: ${{ steps.image.outputs.legacy_release_image }}
      needs_legacy_promotion: ${{ steps.image.outputs.needs_legacy_promotion }}
      schema_compatibility: ${{ steps.compatibility.outputs.level }}
    steps:
      - name: Determine release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0 # need origin/main for the ancestor check

      - name: Resolve schema compatibility
        id: compatibility
        run: |
          set -euo pipefail
          compatibility_file=deploy/SCHEMA_COMPATIBILITY
          level=0
          if [ -e "$compatibility_file" ]; then
            level="$(cat "$compatibility_file")"
            if [[ ! "$level" =~ ^[0-9]+$ ]]; then
              echo "$compatibility_file must contain one non-negative integer." >&2
              exit 1
            fi
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Validate irreversible migration confirmations
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOWNTIME: ${{ inputs.downtime || false }}
          IRREVERSIBLE: ${{ inputs.irreversible_migration || false }}
        run: |
          set -euo pipefail
          marker=deploy/REQUIRES_IRREVERSIBLE_MIGRATION
          if [ -e "$marker" ]; then
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              echo "$marker blocks tag-push deployment; use manual workflow_dispatch with both confirmations." >&2
              exit 1
            fi
            if [ "$DOWNTIME" != "true" ] || [ "$IRREVERSIBLE" != "true" ]; then
              echo "$marker requires downtime=true and irreversible_migration=true." >&2
              exit 1
            fi
          fi
          if [ "$IRREVERSIBLE" = "true" ] && [ "$DOWNTIME" != "true" ]; then
            echo "irreversible_migration=true requires downtime=true." >&2
            exit 1
          fi

      - name: Notify release start
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg content "🏁 Release $RELEASE_TAG started ($GITHUB_EVENT_NAME) — the server will be updated once verification passes. $RUN_URL" \
            '{username: "GitHub Actions", content: $content}' |
            curl --fail-with-body -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL" ||
            echo "warning: release start notification failed; continuing release."

      # Releases deploy only commits that main's full CI matrix has validated.
      # That check replaces re-running tests here — by design the release path
      # never produces a "tested differently" artifact.
      - name: Verify tag commit is on main
        id: verify
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Tag ${{ steps.tag.outputs.tag }} ($SHA) is not an ancestor of origin/main." >&2
            echo "Releases must point at commits that went through main (PR + full CI)." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify manual rollback runtime compatibility
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          target_runtime="$(cat deploy/RELEASE_RUNTIME_COMPATIBILITY 2>/dev/null || printf 0)"
          trusted_runtime="$(git show origin/main:deploy/RELEASE_RUNTIME_COMPATIBILITY 2>/dev/null || printf 0)"
          if [[ ! "$target_runtime" =~ ^[0-9]+$ ]] || [[ ! "$trusted_runtime" =~ ^[0-9]+$ ]]; then
            echo "Invalid release runtime compatibility metadata." >&2
            exit 1
          fi
          if (( target_runtime < trusted_runtime )); then
            echo "Target runtime compatibility $target_runtime is below trusted tooling requirement $trusted_runtime." >&2
            echo "The target image cannot safely use the current Compose, health-check, and proxy contract." >&2
            exit 1
          fi

      - name: Verify CI succeeded for this commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force) }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "CI for $SHA is '${conclusion:-not found}', not 'success'." >&2
            echo "Fix CI (or, for old tags whose runs expired, dispatch with force: true)." >&2
            exit 1
          fi
          echo "CI is green for $SHA"

      # Manual rollback overlays operational files from origin/main. Unlike the
      # historical target tag, this exact tooling commit must always have a
      # successful main-push CI run; force only handles expired CI history for
      # the old application commit and must never authorize unverified tooling.
      - name: Verify CI succeeded for trusted deployment tooling
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.verify.outputs.main_sha }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "CI for trusted deployment tooling $SHA is '${conclusion:-not found}', not 'success'." >&2
            echo "Wait for or fix main CI before deploying a manual rollback." >&2
            exit 1
          fi
          echo "CI is green for trusted deployment tooling $SHA"

      - name: Resolve immutable image
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ steps.verify.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLATFORM: ${{ vars.RELEASE_PLATFORM || 'linux/arm64' }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$RELEASE_PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *) echo "Unsupported RELEASE_PLATFORM: $RELEASE_PLATFORM" >&2; exit 1 ;;
          esac
          arch="${RELEASE_PLATFORM#linux/}"
          sha_image="$repo:sha-$SHA-$arch"
          release_image="$repo:$RELEASE_TAG-$arch"
          legacy_sha_image="$repo:sha-$SHA"
          legacy_release_image="$repo:$RELEASE_TAG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' |
              jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }

          platform_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' |
              jq -er '"\(.os)/\(.architecture)"'
          }

          require_release_platform() {
            local image="$1" actual
            actual="$(platform_of "$image")" || {
              echo "Could not determine platform for legacy image $image." >&2
              return 1
            }
            if [ "$actual" != "$RELEASE_PLATFORM" ]; then
              echo "Legacy image $image is $actual, expected $RELEASE_PLATFORM." >&2
              return 1
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if digest="$(digest_of "$release_image" 2>/dev/null)"; then
              if sha_digest="$(digest_of "$sha_image" 2>/dev/null)" && [ "$sha_digest" != "$digest" ]; then
                echo "Refusing mismatched release image: $release_image ($digest != $sha_digest)." >&2
                exit 1
              fi
              needs_promotion=false
            else
              if digest="$(digest_of "$sha_image" 2>/dev/null)"; then
                needs_promotion=true
              elif digest="$(digest_of "$legacy_release_image" 2>/dev/null)"; then
                require_release_platform "$legacy_release_image"
                if legacy_sha_digest="$(digest_of "$legacy_sha_image" 2>/dev/null)"; then
                  require_release_platform "$legacy_sha_image"
                  if [ "$legacy_sha_digest" != "$digest" ]; then
                    echo "Refusing mismatched legacy release image: $legacy_release_image ($digest != $legacy_sha_digest)." >&2
                    exit 1
                  fi
                fi
                release_image="$legacy_release_image"
                needs_promotion=false
              elif digest="$(digest_of "$legacy_sha_image" 2>/dev/null)"; then
                require_release_platform "$legacy_sha_image"
                sha_image="$legacy_sha_image"
                needs_promotion=true
              else
                echo "No platform-specific or compatible legacy image exists for $RELEASE_TAG ($SHA)." >&2
                exit 1
              fi
            fi
          else
            if ! digest="$(digest_of "$sha_image")"; then
              echo "Prebuilt main image not found: $sha_image" >&2
              echo "Wait for Build Image to pass; releases never rebuild source." >&2
              exit 1
            fi
            if existing_digest="$(digest_of "$release_image" 2>/dev/null)"; then
              if [ "$existing_digest" != "$digest" ]; then
                echo "Refusing to overwrite $release_image ($existing_digest != $digest)." >&2
                exit 1
              fi
              needs_promotion=false
            else
              needs_promotion=true
            fi
          fi

          needs_legacy_promotion=false
          if [ "$release_image" != "$legacy_release_image" ]; then
            if legacy_release_digest="$(digest_of "$legacy_release_image" 2>/dev/null)"; then
              require_release_platform "$legacy_release_image"
              if [ "$legacy_release_digest" != "$digest" ]; then
                echo "Refusing to overwrite legacy release alias: $legacy_release_image ($legacy_release_digest != $digest)." >&2
                exit 1
              fi
            else
              needs_legacy_promotion=true
            fi
          fi

          {
            echo "sha_image=$sha_image"
            echo "release_image=$release_image"
            echo "digest=$digest"
            echo "image_ref=$repo@$digest"
            echo "needs_promotion=$needs_promotion"
            echo "legacy_release_image=$legacy_release_image"
            echo "needs_legacy_promotion=$needs_legacy_promotion"
          } >> "$GITHUB_OUTPUT"

  # Stamp the sha image with the immutable version tag. A manifest copy inside
  # GHCR — no layers move, takes seconds, and the digest (i.e. the artifact)
  # provably equals what main built and tested.
  promote:
    runs-on: ubuntu-latest
    name: "Promote image to version tag"
    needs: [resolve]
    if: ${{ needs.resolve.outputs.needs_promotion == 'true' || needs.resolve.outputs.needs_legacy_promotion == 'true' }}
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release image
        env:
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.digest }}
          SHA_IMAGE: ${{ needs.resolve.outputs.sha_image }}
          RELEASE_IMAGE: ${{ needs.resolve.outputs.release_image }}
          LEGACY_RELEASE_IMAGE: ${{ needs.resolve.outputs.legacy_release_image }}
          NEEDS_PROMOTION: ${{ needs.resolve.outputs.needs_promotion }}
          NEEDS_LEGACY_PROMOTION: ${{ needs.resolve.outputs.needs_legacy_promotion }}
        run: |
          set -euo pipefail
          for promotion in \
            "$NEEDS_PROMOTION:$RELEASE_IMAGE" \
            "$NEEDS_LEGACY_PROMOTION:$LEGACY_RELEASE_IMAGE"; do
            [ "${promotion%%:*}" = "true" ] || continue
            target="${promotion#*:}"
            docker buildx imagetools create -t "$target" "$SHA_IMAGE"
            actual="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')"
            if [ "$actual" != "$EXPECTED_DIGEST" ]; then
              echo "Promoted digest mismatch for $target: $actual != $EXPECTED_DIGEST" >&2
              exit 1
            fi
          done

  deploy:
    runs-on: ubuntu-latest
    name: "Deploy to server"
    needs: [resolve, promote]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # the server pulls from GHCR with this job's ephemeral token
    # Deploys run under the `production` environment so protection rules
    # (required reviewers, wait timers) can be added in repo Settings without
    # editing this file.
    environment: production
    steps:
      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # A manual rollback intentionally checks out old application source and
      # deploys its old immutable image, but must not downgrade the server-side
      # deployment contract. In particular, pre-group_add Compose revisions
      # cannot read the current 0640 .env.production bind mount. Pin the exact
      # main commit verified by the resolve job and overlay only operational
      # tooling; the target tag keeps its own schema compatibility metadata.
      - name: Checkout trusted deployment tooling for manual rollback
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.main_sha }}
          path: .trusted-release-tooling
          sparse-checkout: |
            deploy/release-deploy.sh
            deploy/admin-web-deploy.sh
            deploy/caddy-entrypoint.sh
            deploy/overlay-trusted-release-tooling.sh
            deploy/app-env-preflight.sh
            deploy/app-env-transaction.sh
            deploy/offsite-backup.sh
            deploy/Caddyfile.admin
            Dockerfile.caddy
            docker-compose.prod.yml
            docker-compose.release.yml
            docker-compose.admin-release.yml
          sparse-checkout-cone-mode: false

      - name: Overlay trusted deployment tooling for manual rollback
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          bash .trusted-release-tooling/deploy/overlay-trusted-release-tooling.sh \
            .trusted-release-tooling .
          rm -rf -- .trusted-release-tooling

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "Missing DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, and/or DEPLOY_HOST." >&2
            echo "Configure them in repo Settings (see DEPLOY.md §6) before releasing." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The deployment key has a server-side ForceCommand. It accepts only this
      # bounded stage protocol and the activate protocol below; historical
      # workflow revisions cannot obtain a shell or replace the trusted launcher.
      - name: Verify server release gate contract
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          capabilities="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "circle-release capabilities")"
          if [ "$capabilities" != "release-gate=1 launcher-runtime=1" ]; then
            echo "Server release gate is not upgraded for runtime compatibility: $capabilities" >&2
            echo "Install the root-owned gate and launcher from DEPLOY.md before releasing." >&2
            exit 1
          fi

      - name: Stage release on server
        id: stage
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          CIRCLE_BE_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          RELEASE_SCHEMA_COMPATIBILITY: ${{ needs.resolve.outputs.schema_compatibility }}
          RELEASE_DOWNTIME: ${{ inputs.downtime && '1' || '0' }}
          RELEASE_IRREVERSIBLE_MIGRATION: ${{ inputs.irreversible_migration && '1' || '0' }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing RELEASE_SIGNING_PRIVATE_KEY." >&2
            exit 1
          fi
          STAGED_RELEASE_NAME="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RELEASE_SHA"
          archive="$RUNNER_TEMP/release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          manifest="$RUNNER_TEMP/release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.manifest"
          signature="$manifest.sig"
          private_key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$archive" "$manifest" "$signature" "$private_key"' EXIT
          tar -czf "$archive" \
            --exclude=./.env \
            --exclude=./.env.production \
            --exclude=./.release \
            --exclude=./.git \
            --exclude=./node_modules \
            --exclude=./dist \
            --exclude=./logs \
            --exclude=./coverage \
            .
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          issued_at="$(date -u +%s)"
          printf '%s\n' \
            'version=2' \
            "issued_at=$issued_at" \
            "stage=$STAGED_RELEASE_NAME" \
            "source_sha=$RELEASE_SHA" \
            "archive_sha256=$archive_sha256" \
            "release_tag=$RELEASE_TAG" \
            "image=$CIRCLE_BE_IMAGE" \
            "schema=$RELEASE_SCHEMA_COMPATIBILITY" \
            "downtime=$RELEASE_DOWNTIME" \
            "irreversible=$RELEASE_IRREVERSIBLE_MIGRATION" > "$manifest"
          printf '%s\n' "$RELEASE_SIGNING_PRIVATE_KEY" > "$private_key"
          chmod 0600 "$private_key"
          openssl dgst -sha256 -sign "$private_key" -out "$signature" "$manifest"
          manifest_b64="$(base64 -w0 "$manifest")"
          signature_b64="$(base64 -w0 "$signature")"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "circle-release stage-v2 $STAGED_RELEASE_NAME $manifest_b64 $signature_b64" < "$archive"
          echo "name=$STAGED_RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Activate staged release on server
        env:
          STAGED_RELEASE_NAME: ${{ steps.stage.outputs.name }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          CIRCLE_BE_IMAGE: ${{ needs.resolve.outputs.image_ref }}
          RELEASE_DOWNTIME: ${{ inputs.downtime && '1' || '0' }}
          RELEASE_IRREVERSIBLE_MIGRATION: ${{ inputs.irreversible_migration && '1' || '0' }}
          RELEASE_SCHEMA_COMPATIBILITY: ${{ needs.resolve.outputs.schema_compatibility }}
          # Ephemeral job token: lets the server pull from GHCR during this job
          # only. The image stays in the local Docker cache afterwards, so
          # restarts and cached rollbacks need no registry access.
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          # Values travel as a fixed seven-line stdin protocol, never shell or
          # argv. The server validates every field before invoking the launcher.
          printf '%s\n' \
            "$RELEASE_SCHEMA_COMPATIBILITY" \
            "$RELEASE_TAG" \
            "$CIRCLE_BE_IMAGE" \
            "$RELEASE_DOWNTIME" \
            "$RELEASE_IRREVERSIBLE_MIGRATION" \
            "$GHCR_USER" \
            "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "circle-release activate-v2 $STAGED_RELEASE_NAME"

      # Outside-in verification from a network the server does not control:
      # the runner probes the public API domain after the switch.
      - name: External smoke check
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          API_SMOKE_URL: ${{ vars.API_SMOKE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$API_SMOKE_URL" ]; then
            echo "vars.API_SMOKE_URL not set; skipping external smoke check."
            exit 0
          fi
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          for _ in 1 2 3 4 5 6; do
            : >"$headers"
            : >"$body"
            if ! code="$(curl -m 10 -sS -H 'Accept: application/json' -D "$headers" -o "$body" \
              -w '%{http_code}' "$API_SMOKE_URL")"; then
              code=000
            fi
            case "$code" in
              401|403)
                if grep -Eqi '^content-type:[[:space:]]*application/(problem\+)?json([;[:space:]]|$)' "$headers"; then
                  echo "external smoke ok (HTTP $code JSON)"
                  exit 0
                fi
                ;;
            esac
            sleep 5
          done
          echo "external smoke failed (last HTTP $code; expected 401/403 JSON) — the server-side check passed," >&2
          head -c 500 "$body" >&2 || true
          echo "so suspect DNS/firewall/CDN in front of $DEPLOY_HOST." >&2
          exit 1

  # Changelog comes from GitHub's generated notes (PRs/commits since the
  # previous tag). Tag pushes only — a dispatch redeploy/rollback must not
  # touch release history.
  publish_release:
    runs-on: ubuntu-latest
    name: "Publish GitHub Release"
    needs: [resolve, deploy]
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          generate_release_notes: true

  # Always report the outcome — a failed deploy must be as loud as a good one.
  # This job only reports; the release result is the jobs above.
  notify:
    runs-on: ubuntu-latest
    name: "Notify Discord"
    needs: [resolve, promote, deploy, publish_release]
    if: always()
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Send Discord Notification
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag || inputs.tag || github.ref_name }}
          IMAGE: ${{ needs.resolve.outputs.image_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE' > payload.json
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const jobLines = Object.entries(needs).map(
            ([name, job]) => `${name}: ${job.result}`,
          );
          const failed = Object.values(needs).some((job) =>
            ['failure', 'cancelled'].includes(job.result),
          );
          const mode =
            process.env.EVENT_NAME === 'push'
              ? 'promoted the image built on main'
              : 'redeployed an existing immutable release';

          const repo = process.env.GITHUB_REPOSITORY;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const releaseUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/releases/tag/${process.env.RELEASE_TAG}`;

          const embed = {
            author: {
              name: failed ? '🚨 Release failed' : '🚀 Release deployed',
            },
            title: `${repo} ${process.env.RELEASE_TAG}`.slice(0, 256),
            url: releaseUrl,
            // GitHub colors: success = green (#1a7f37), failure = red (#cf222e).
            color: failed ? 0xcf222e : 0x1a7f37,
            fields: [
              {
                name: 'Image',
                value: `${process.env.IMAGE || '(not resolved)'} — ${mode}`,
              },
              {
                name: 'Trigger',
                value: process.env.EVENT_NAME,
                inline: true,
              },
              {
                name: 'Jobs',
                value: jobLines.join('\n'),
              },
              {
                name: 'Run',
                value: runUrl,
              },
            ],
          };

          process.stdout.write(
            JSON.stringify({ username: 'GitHub Actions', embeds: [embed] }),
          );
          NODE

          curl --fail-with-body \
            -H 'Content-Type: application/json' \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
