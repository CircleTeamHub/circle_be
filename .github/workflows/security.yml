# Security scanning: secret detection (blocking) + dependency audit (advisory),
# plus a daily re-scan of the images already published to GHCR.
# CodeQL is intentionally omitted: this repo is private, so CodeQL would require
# paid GitHub Advanced Security. Revisit if GHAS is enabled or the repo is public.

name: Security

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.env.example'
  schedule:
    # Daily: advisories land every day, and without this a new one is only seen
    # when some unrelated PR happens to run into it (body-parser, 2026-10-24).
    - cron: "0 6 * * *"
  workflow_dispatch:

# The event is part of the group: scheduled and manual runs also have
# ref=main, and sharing a group with pushes let any merge during the image scan
# cancel that day's scan.
concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: "Secret scan (TruffleHog)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so PR/push diffs can be scanned

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # Only verified secrets fail the build → near-zero false positives.
          extra_args: --only-verified

  dependency-audit:
    runs-on: ubuntu-latest
    name: "Dependency audit (npm)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Blocking: production deps must carry no HIGH/CRITICAL advisory. The legacy
      # backlog was cleared (multer / picomatch pinned via package.json overrides).
      # If an unfixable advisory ever needs tolerating, prefer a scoped exception
      # over re-adding a blanket `|| true`.
      - name: npm audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high

  # An image is scanned once, when main builds it, and production then runs it
  # for weeks. Fixes published since — base-image OS packages, npm packages
  # baked into it — never reach that verdict. Re-scan what is actually
  # published: `main-<arch>` (what the next release ships) and the newest
  # released `vX.Y.Z-<arch>` (what production normally runs; after a manual
  # rollback it runs an older one). Same verdict rules as the build-time scan
  # in build-image.yml. Pull requests already scan the image they build.
  published-image-scan:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    name: "Published image scan (Trivy)"
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # release tags

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published images
        id: images
        env:
          RELEASE_PLATFORM: ${{ vars.RELEASE_PLATFORM || 'linux/arm64' }}
        run: |
          set -euo pipefail
          case "$RELEASE_PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *) echo "Unsupported RELEASE_PLATFORM: $RELEASE_PLATFORM" >&2; exit 1 ;;
          esac
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          arch="${RELEASE_PLATFORM#linux/}"
          echo "main=$repo:main-$arch" >> "$GITHUB_OUTPUT"
          # Same release-tag rule as auto-release.yml: strict vX.Y.Z, version
          # order (git's v:refname puts v1beta and -rc tags above v1.2.10). A
          # tag gets its image only when release.yml promotes it, minutes after
          # the tag — or never, if that release failed — so take the newest tag
          # whose image exists instead of failing the scan every day.
          release=""
          for tag in $(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r | head -n 10); do
            if docker buildx imagetools inspect "$repo:$tag-$arch" >/dev/null 2>&1; then
              release="$repo:$tag-$arch"
              break
            fi
            echo "::notice::$tag has no published $arch image; trying the previous release"
          done
          if [ -n "$release" ]; then
            echo "release=$release" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No released image found; scanning main only."
          fi

      - name: Scan main image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.main }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

      - name: Scan latest release image
        if: ${{ always() && steps.images.outputs.release != '' }}
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.release }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-audit
      - published-image-scan
    # !cancelled(): a run superseded by a newer one is not news; a job that
    # was cancelled on its own (a timeout) still is.
    if: ${{ !cancelled() && (contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled')) }}
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Send Discord Notification
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE' > payload.json
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const failedJobs = Object.entries(needs)
            .filter(([, job]) => ['failure', 'cancelled'].includes(job.result))
            .map(([name, job]) => `${name}: ${job.result}`);

          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const refName = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;
          const shortSha = process.env.GITHUB_SHA.slice(0, 7);

          const payload = {
            username: 'GitHub Actions',
            content: [
              `:rotating_light: **Backend Security ${failedJobs.some((job) => job.endsWith('cancelled')) ? 'cancelled' : 'failed'}**`,
              `**Repository:** ${process.env.GITHUB_REPOSITORY}`,
              `**Ref:** ${refName}`,
              `**Commit:** ${shortSha}`,
              `**Actor:** ${process.env.GITHUB_ACTOR}`,
              `**Jobs:** ${failedJobs.join(', ')}`,
              `**Run:** ${runUrl}`,
            ].join('\n'),
          };

          process.stdout.write(JSON.stringify(payload));
          NODE

          curl --fail-with-body \
            -H 'Content-Type: application/json' \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
