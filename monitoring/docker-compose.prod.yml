# Production overlay for the monitoring stack.
#
#   docker compose -f monitoring/docker-compose.yml \
#                  -f monitoring/docker-compose.prod.yml up -d
#
# Without it, the stack scrapes the DEV backend (host.docker.internal:3000) and
# monitors nothing in production — see README.md "Scraping production".
#
# It changes Prometheus in four ways:
#   1. joins it to the circle-be compose network, the only place the backend is
#      reachable (docker-compose.prod.yml only does `expose: 3000`);
#   2. swaps in prometheus.prod.yml (blue-green DNS discovery + bearer auth);
#   3. mounts the METRICS_AUTH_TOKEN credentials file;
#   4. mounts the public probe targets for the blackbox exporter.
#
# It also PINS every image and adds the blackbox and postgres/redis exporters —
# see the sections below for why none of them belongs in the base file.
#
# Prerequisites:
#   - the circle-be stack is up, so its network exists;
#   - monitoring/prometheus/metrics_token exists — run monitoring/sync-metrics-token.sh;
#   - monitoring/.env.exporters exists — run monitoring/sync-exporter-env.sh;
#   - monitoring/prometheus/probe-targets/public.yml exists — copy it from
#     public.yml.example and fill in this deployment's domains (without it,
#     PublicProbeNotConfigured fires).

# ── Pinned image versions ─────────────────────────────────────────────────────
# The base file uses :latest for a frictionless local start. On a server that is
# a live hazard: the next `up -d` — typically run *while debugging some other
# incident* — silently pulls a new major, the stack fails to come back, and the
# monitoring is gone exactly when it is needed. Prometheus 3.x and Grafana 12→13
# both shipped breaking changes this way.
#
# Bump these deliberately, one at a time, and check the release notes.
# The Grafana pin matches the version the README's admin-password reset caveat
# was verified against; the Prometheus pin matches the promtool version CI runs.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  prometheus:
    image: prom/prometheus:v3.7.3
    networks:
      # Named explicitly because adding a second network would otherwise drop
      # the implicit default, and Prometheus must keep reaching alertmanager /
      # node-exporter / cadvisor over the monitoring network.
      - default
      - circle-be
    volumes:
      # Overrides the dev config mounted at the same path by the base file.
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      # Gitignored, 0600, owned by uid 65534 (the `nobody` user Prometheus runs
      # as) — otherwise the container cannot read it and every scrape 401s.
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      # Public probe targets for this deployment (gitignored public.yml, created
      # from public.yml.example). The whole directory is mounted so file_sd picks
      # up edits without a restart.
      - ./prometheus/probe-targets:/etc/prometheus/probe-targets:ro

  node-exporter:
    image: prom/node-exporter:v1.11.0

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1

  alertmanager:
    image: prom/alertmanager:v0.29.0

  grafana:
    image: grafana/grafana:13.1.0

  # ── 公网可达性探测 ────────────────────────────────────────────────────
  # 按用户的路径请求公网入口（DNS → TLS → Caddy → 服务），补上内网直连看不到的
  # 那一面。探测配置在仓库里，告警走 Alertmanager 的分级与抑制，不在某个 Web UI
  # 里单独配置、直连 Discord。
  #
  # 只在生产 overlay 里定义，理由同下面两个 exporter：开发机没有公网域名，放进
  # 基础文件只会得到一个永远没有目标的探测器。
  #
  # 不加入 circle-be 网络，也不发布端口：它走公网访问目标，只给 Prometheus 在
  # 监控网络里调用。端口发布出去的话，任何人都能让它替自己去请求任意 target=。
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: circle-blackbox-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  # ── 数据库与缓存指标 ────────────────────────────────────────────────────
  # 只在生产 overlay 里定义,不进基础文件:开发机上 Postgres/Redis 常常不在
  # Docker 里跑(或压根没跑),放进基础文件会得到两个永远 DOWN 的 target ——
  # 正是这套配置里反复警惕的「常年红 → 训练运维忽略红色」。
  #
  # 补的是此前完全没有的一面:`circle_redis_up` 只有 0/1,Postgres 一个指标
  # 都没有。而生产就绪审计里「pg 连接池只有 10」是已知阻塞项 —— 池打满不会
  # 立刻变成 5xx,而是先表现为请求排队,等 BackendHighLatencyP95 响的时候
  # 已经晚了。pg_stat_activity 的连接数是唯一能提前看到它的东西。
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.0
    container_name: circle-postgres-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    # DATA_SOURCE_NAME —— 由 sync-exporter-env.sh 从 .env.production 派生,
    # 因为 DATABASE_URL 带着 Prisma 的 ?schema=public,libpq 会直接拒绝。
    env_file:
      # required: false —— 漏跑 sync-exporter-env.sh 时只让这个 exporter 起不来
      # (target DOWN → TargetDown 告警),而不是让整个监控栈拒绝启动。一个忘跑的
      # 脚本不该把 Prometheus 和 Alertmanager 一起拖下水。
      - path: .env.exporters
        required: false
    networks:
      - default
      - circle-be

  redis-exporter:
    image: oliver006/redis_exporter:v1.83.0
    container_name: circle-redis-exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    # REDIS_ADDR 收完整的 redis:// URI,凭据由 exporter 自己解析(含百分号编码)。
    # 托管 Redis 同样适用 —— 它不依赖 bundled-redis profile 是否启用。
    env_file:
      # required: false —— 漏跑 sync-exporter-env.sh 时只让这个 exporter 起不来
      # (target DOWN → TargetDown 告警),而不是让整个监控栈拒绝启动。一个忘跑的
      # 脚本不该把 Prometheus 和 Alertmanager 一起拖下水。
      - path: .env.exporters
        required: false
    networks:
      - default
      - circle-be

networks:
  circle-be:
    # Created by the circle-be stack (docker-compose.prod.yml sets
    # `name: circle-be`, so compose names its default network circle-be_default).
    # `external` means this overlay never creates or removes it — bring the app
    # stack up first. Override CIRCLE_BE_NETWORK in monitoring/.env if you run
    # the app stack under a different compose project name.
    external: true
    name: ${CIRCLE_BE_NETWORK:-circle-be_default}
