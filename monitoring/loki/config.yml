# Single-node filesystem store. No public ports and no outbound analytics.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache

ingester:
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 128MB

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 10
  delete_request_store: filesystem

limits_config:
  retention_period: 168h
  max_query_lookback: 168h
  # Prevent Loki from adding inferred service_name labels to the bounded set.
  discover_service_name: []
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_global_streams_per_user: 100
  max_line_size: 64KB
  max_query_parallelism: 2

querier:
  max_concurrent: 2

analytics:
  reporting_enabled: false
