# Prometheus config for scraping the PRODUCTION backend.
#
# Used only via the prod overlay, which mounts this file over
# /etc/prometheus/prometheus.yml and joins Prometheus to the circle-be network:
#
#   docker compose -f monitoring/docker-compose.yml \
#                  -f monitoring/docker-compose.prod.yml up -d
#
# Plain `-f monitoring/docker-compose.yml` keeps using prometheus.yml (dev:
# backend on the host at host.docker.internal:3000, no auth). See README.md
# "Scraping production".
#
# Differences from prometheus.yml (keep the rest in sync when editing either):
#   - the circle-be job (blue-green DNS discovery + bearer auth);
#   - the postgres/redis exporter jobs, which exist only here. On a dev machine
#     Postgres and Redis often are not in Docker (or not running at all), so
#     putting them in the base file would mean two permanently DOWN targets —
#     which just teaches everyone to ignore red;
#   - the blackbox-http / blackbox-exporter jobs (public reachability probes),
#     which exist only here for the same reason: a dev machine has no public
#     domain to probe.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Populated only by docker-compose.logs.yml. An absent optional stack
  # contributes no target and therefore cannot make the base deployment red.
  - job_name: logs-pipeline
    file_sd_configs:
      - files: ['/etc/prometheus/log-targets/*.yml']

  - job_name: circle-be
    metrics_path: /metrics
    # ── Reaching the backend ──────────────────────────────────────────────
    # Production never publishes port 3000 (docker-compose.prod.yml only does
    # `expose: 3000`), so host.docker.internal cannot work — the prod overlay
    # puts Prometheus on the circle-be compose network and we address the
    # backend by container name, exactly like Caddy does.
    #
    # ── Why DNS discovery and not a static target ────────────────────────
    # Deployment is blue-green (deploy/release-deploy.sh): the live container
    # alternates between circle-be-blue and circle-be-green, and the retired
    # colour is `compose rm`'d — so in steady state exactly ONE of the two
    # names exists. A static target pinned to one colour is DOWN after every
    # other release; listing both as static targets leaves one target
    # permanently red, which trains operators to ignore red.
    #
    # Resolving both names through Docker's embedded DNS yields a target only
    # for the colour(s) that actually exist: one in steady state, two briefly
    # mid-release (which is what you want — the new colour's metrics are
    # visible before Caddy switches traffic to it, and the old colour keeps
    # reporting until it is removed). A name with no container returns NXDOMAIN
    # and contributes no target, silently and with no lookup failure.
    #
    # Trade-off: when NO colour is running, discovery returns nothing and the
    # `up` series disappears rather than going to 0 — so `up == 0` cannot catch
    # a fully-down backend. That gap is covered by the CircleBeNoTarget
    # (absent()) alert in alerts.yml. Do not remove it.
    dns_sd_configs:
      - names: ['circle-be-blue', 'circle-be-green']
        type: A
        port: 3000
        refresh_interval: 15s
    # ── Authentication ────────────────────────────────────────────────────
    # deploy/gen-env.sh always writes a random METRICS_AUTH_TOKEN into
    # .env.production, so a correctly bootstrapped production backend ALWAYS
    # requires this header — scraping it without one is a guaranteed 401 and a
    # silently empty dashboard. The file is written by monitoring/sync-metrics-token.sh
    # and is gitignored; Prometheus trims trailing whitespace/newline from it.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    relabel_configs:
      # Without this, `instance` is the container IP, which changes on every
      # release and fragments every per-instance series. __meta_dns_name is the
      # name we asked for, i.e. a stable circle-be-blue / circle-be-green.
      - source_labels: [__meta_dns_name]
        target_label: instance
      # Lets you tell the colours apart mid-release (and keeps the two targets'
      # series distinct, so they never collide on a duplicate instance label).
      - source_labels: [__meta_dns_name]
        regex: 'circle-be-(blue|green)'
        target_label: color
        replacement: '${1}'

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # pg_stat_activity_count 带 application_name / usename / wait_event /
  # wait_event_type / backend_type 五个维度，看着像基数风险，但取值都来自
  # PostgreSQL 的固定枚举（实测空库 24 条序列，真实负载下也就几百条）。
  #
  # 不要为此加 labeldrop：只差一个被丢掉的标签的两条序列会塌缩成同名同标签,
  # Prometheus 判定为 duplicate sample 并丢弃**整次抓取** —— 为了省几百条
  # 序列，换来的是这个 job 的所有指标一起消失。
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  # ── 公网可达性探测（blackbox-exporter）────────────────────────────────
  # 上面的 job 都在 compose 内网里直连容器，看不到只发生在「进来的路上」的故障：
  # DNS 指错、证书过期、Caddy 配坏、入口被拦 —— 内网一切正常，用户却进不来。
  # 这里让 exporter 按用户的路径去请求公网地址（DNS → TLS → Caddy → 服务）。
  #
  # 目标按部署填写、不进仓库：从 probe-targets/public.yml.example 复制出
  # public.yml。文件不存在时这个 job 没有目标、probe_success 根本不存在 ——
  # PublicProbeNotConfigured 专门抓这种「看着装好了、其实什么都没探」的状态。
  # file_sd 会监视文件改动，改完不用重启。
  #
  # 30s 一次足够：可达性故障以分钟计，没必要按 15s 的全局频率去打公网入口。
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/probe-targets/*.yml']
    relabel_configs:
      # 目标地址不是抓取对象，而是交给 exporter 的 ?target= 参数。
      - source_labels: [__address__]
        target_label: __param_target
      # instance 用被探测的 URL，告警里才看得出是哪个入口。
      - source_labels: [__param_target]
        target_label: instance
      # 真正被抓取的是 exporter 自己。
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # exporter 本身也要抓：它挂了 TargetDown 才会响，PublicProbeNotConfigured 也靠
  # 这里的 up 判断「exporter 确实在跑」。
  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox-exporter:9115']
