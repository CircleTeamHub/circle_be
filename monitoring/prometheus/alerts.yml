groups:
  - name: circle-be
    rules:
      - alert: BackendHigh5xx
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend 5xx error ratio > 5% for 2m"

      - alert: BackendHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency > 1s for 5m"

      # Event-loop lag is the signal unique to a single-threaded Node process:
      # requests can still return 200 while the loop is blocked, so this fires
      # before latency/5xx alerts do. Metric comes free from prom-client's
      # collectDefaultMetrics (see src/metrics/metrics.service.ts).
      - alert: BackendEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="circle-be"} > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Backend event-loop lag p99 > 250ms for 5m (process is blocking)"

      # openim 有意排除：它的 metrics 端口随 OpenIM 版本而异，要在服务器上确认后才
      # 填得对（runbook 第 7 步）。端口没填对时这个 target 会一直红着，而一条永远红的
      # critical 会训练运维忽略红色 —— 正是 prometheus.prod.yml 里反复警告的事。
      # 它由下面的 OpenIMMetricsUnreachable（warning）单独覆盖。
      - alert: TargetDown
        expr: up{job!="openim"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"

      # Companion to TargetDown, and NOT redundant with it. In production the
      # circle-be job is DNS service discovery over the blue/green container
      # names (prometheus.prod.yml): if no colour is running, discovery returns
      # zero targets, so `up{job="circle-be"}` stops existing rather than going
      # to 0 — and `up == 0` above can never fire. This catches exactly that
      # hole: a backend that is not merely broken but entirely absent.
      #
      # Harmless in dev, where the job is a static target and `up` always exists.
      # 5m tolerates a blue-green switch, which briefly runs both colours and
      # then removes one; it never leaves zero.
      - alert: CircleBeNoTarget
        expr: absent(up{job="circle-be"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No circle-be scrape target exists (no backend container is running)"

  # 消息洪泛（恶意刷屏 / 群消息风暴）的可观测性。
  #
  # 前提：聊天消息完全在客户端 SDK 与 OpenIM 之间流转，不经过 circle-be
  # （docs/openim-integration.md）。所以上面那组 circle-be 指标在一次洪泛中可以纹丝
  # 不动 —— 5xx 正常、延迟正常、事件循环正常，而 OpenIM 那边已经被打爆。这一组盯的
  # 就是那个盲区。
  - name: openim-flood
    rules:
      # 没接上抓取 = 洪泛不可见。降为 warning 的理由见上面 TargetDown 的注释；
      # 15m 是为了不被一次 OpenIM 重启噪扰。
      - alert: OpenIMMetricsUnreachable
        expr: up{job="openim"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "OpenIM metrics are not being scraped — a message flood would be invisible (verify prometheusPort, runbook step 7)"

      # OpenIM 栈（mongo/kafka/msggateway…）没有 compose 级资源上限，只有 runbook 里
      # 手工的 docker update，而 `compose up --force-recreate` 就会让它失效。它又和业务栈
      # 同机：一次洪泛把内存吃爆，倒下的是整台机器，连带业务 API。
      # 分母加 `> 0` 是必须的 —— 无上限容器的 limit 为 0，不过滤会得到 +Inf 从而永远告警。
      #
      # 分子用 working_set 而不是 usage：container_memory_usage_bytes 把可回收的
      # page cache 也算进去，数据库/消息队列稳定运行时它本来就会贴着上限（内核在
      # 内存紧张时自然回收，不会 OOM）。用 usage 会让 mongo/kafka/postgres 常驻红色 ——
      # 正是本文件反复警告的「永远红 → 训练运维忽略告警」。working_set 是 OOM killer
      # 实际参考的量，逼近上限才真的意味着要被杀。
      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is at >90% of its memory limit"

      # 无上限的容器不会触发上面那条，而 OpenIM 栈恰恰是这种。用主机 CPU 兜底：
      # 刷消息最先表现为 CPU 打满，而 HighMemory 要等内存真吃满才响，往往已经太晚。
      - alert: HostCpuSaturated
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU > 90% for 10m (message flood or runaway container?)"

      # 洪泛的第二个落点是磁盘：Kafka 日志段 + Mongo 消息集合。容器日志已配轮转
      # （runbook 第 3 步），但消息数据本身没有任何上限。
      - alert: HostDiskFilling
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} below 15% free"

  - name: host
    rules:
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Host memory usage > 85% for 5m"

      # #87：私有笔记媒体的桶策略未确认应用 —— notes/* 可能匿名可读。
      # /readyz 有意不因此变红（策略失败在所有副本相同，fail-closed = 全站故障），
      # 这条告警是唯一的叫醒机制。
      - alert: ObjectStorePolicyUnconfirmed
        expr: max(circle_object_store_policy_unconfirmed) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Private-media bucket policy unconfirmed — notes/* may be anonymously readable"

      # #102：会话撤销 fail-open 依赖 Redis。Redis 挂掉期间登出/封禁/盗号撤销
      # 全部静默失效（HTTP 与 WS 同步失效），必须有人处理。
      - alert: RedisDown
        # round 2 review：min 而不是 max —— 蓝绿切换/单色坏配置时，只要有
        # 一个仍在服务的实例丢了 Redis（撤销 fail-open），就必须响。
        expr: min(circle_redis_up) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down — session revocation is silently fail-open while this fires"
