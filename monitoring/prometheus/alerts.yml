groups:
  - name: circle-be
    rules:
      - alert: BackendHigh5xx
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Backend 5xx error ratio > 5% for 2m'

      - alert: BackendHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Backend p95 latency > 1s for 5m'

      # Event-loop lag is the signal unique to a single-threaded Node process:
      # requests can still return 200 while the loop is blocked, so this fires
      # before latency/5xx alerts do. Metric comes free from prom-client's
      # collectDefaultMetrics (see src/metrics/metrics.service.ts).
      - alert: BackendEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds{job="circle-be"} > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Backend event-loop lag p99 > 250ms for 5m (process is blocking)'

      # 漏掉 .catch 的 promise 被进程级兜底接住（src/logging/unhandled-rejection-guard.ts），
      # 进程不死，5xx / TargetDown 都看不到它。错误聚合默认关闭，那时这是唯一的叫醒
      # 机制；具体是哪一处，看同一时刻日志里的 `[unhandledRejection]` 行。
      #
      # increase 而不是存量 > 0：计数器只增不减，按存量会在第一条之后永久 firing。
      # 15 分钟内没有新增就自动消警。sum：蓝绿期间两个颜色各数各的。
      #
      # 第二段补 increase() 的盲点：它不把新序列的第一个样本当作从 0 起，新进程在
      # 第一次被抓取之前就漏出的那条会被吃掉 —— 而启动阶段 Redis / DB 还没就绪，
      # 恰恰最容易漏 .catch。15 分钟前还不存在的序列，现值本身就是新增。
      - alert: UnhandledRejectionsOccurring
        expr: |
          sum(increase(circle_unhandled_rejections_total{job="circle-be"}[15m])) > 0
            or
          sum(
            circle_unhandled_rejections_total{job="circle-be"}
              unless circle_unhandled_rejections_total{job="circle-be"} offset 15m
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Backend caught unhandled promise rejection(s) in the last 15m — a missing .catch; see [unhandledRejection] log lines'

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Scrape target {{ $labels.job }} is down'

      # Companion to TargetDown, and NOT redundant with it. In production the
      # circle-be job is DNS service discovery over the blue/green container
      # names (prometheus.prod.yml): if no colour is running, discovery returns
      # zero targets, so `up{job="circle-be"}` stops existing rather than going
      # to 0 — and `up == 0` above can never fire. This catches exactly that
      # hole: a backend that is not merely broken but entirely absent.
      #
      # Harmless in dev, where the job is a static target and `up` always exists.
      # 5m tolerates a blue-green switch, which briefly runs both colours and
      # then removes one; it never leaves zero.
      - alert: CircleBeNoTarget
        expr: absent(up{job="circle-be"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'No circle-be scrape target exists (no backend container is running)'

  # 公网可达性 —— 从用户的路径看服务（blackbox-exporter，仅生产 overlay）。
  #
  # 上面那组都来自 Prometheus 在 compose 内网里直连容器：DNS 指错、证书过期、
  # Caddy 配坏、入口被拦时它们一切正常，而用户已经完全进不来。这里的探测按用户
  # 的路径请求公网地址（DNS → TLS → Caddy → 服务）。
  #
  # 它和被监控对象在同一台机器上：整机宕机或断网时它也一起没了，那种情况只能靠
  # meta 组的 Watchdog 外部心跳。
  - name: reachability
    rules:
      # 30s 探一次、for: 2m = 连续失败好几次才叫人，单次网络抖动不报。
      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Public endpoint {{ $labels.instance }} is failing its probe (DNS, TLS, Caddy or the service behind it)'

      # Caddy 在证书剩 ~30 天时自动续期。剩不到 14 天说明续期已经连续失败两周多，
      # 剩不到 3 天再不处理，客户端就会拒绝连接。
      #
      # 两档故意用不同的告警名。通用的「critical 压掉同名 warning」抑制只比对
      # alertname，而这里探的是好几个域名、各自续期：共用一个名字时，api 证书的
      # critical 会把 admin 证书那条毫不相干的 warning 一起静音。同一张证书两档都
      # 响时只留 critical，由 alertmanager.yml 里按 instance 配对的专门规则负责。
      - alert: TlsCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate for {{ $labels.instance }} expires in less than 14 days — automatic renewal has been failing'

      - alert: TlsCertificateExpiryImminent
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 3 * 86400
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'TLS certificate for {{ $labels.instance }} expires in less than 3 days — renew it now or clients will refuse to connect'

      # 探测目标按部署写在 gitignored 的 probe-targets/public.yml 里。漏配时这个
      # job 一个目标都没有、probe_success 根本不存在 —— 上面几条永远不会响，
      # 看起来却像「装好了、一切正常」。
      #
      # 只在 blackbox-exporter 真的在跑时才判断：它只存在于生产 overlay，不加这个
      # 前提的话，每台开发机上都会常年红。
      - alert: PublicProbeNotConfigured
        expr: |
          absent(probe_success{job="blackbox-http"})
            and on() (up{job="blackbox-exporter"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'blackbox-exporter is running but nothing is being probed — create monitoring/prometheus/probe-targets/public.yml'

  # 定时任务与 outbox 队列 —— 「什么都没发生」这一类故障。
  #
  # 这一组补的是错误监控天然看不见的盲区：outbox 处理器都自己 catch 异常、写进
  # 行上的 lastError 然后继续，异常永远不逃出去；调度器停了更是什么都不发生。
  # 错误聚合默认关闭，就算打开也只收到显式上报的那几处。队列堵死时 RED 大盘
  # 一切正常、Sentry 一片安静。覆盖 @TrackedCron 与 @TrackedInterval 的全部任务、
  # OUTBOX_QUEUES 的全部队列。
  - name: jobs
    rules:
      # 阈值不写死：每分钟任务和每天 4 点的任务共用这一条规则，各自的预期周期
      # 由 circle_cron_interval_seconds 带过来（在 TrackedCron 装饰期写入）。
      # 为每个任务手写阈值的结果必然是新任务漏配、悄无声息。
      #
      # max by (exported_job)：蓝绿发布期间两个颜色同时在跑，只要有一个实例把活干了就
      # 不该响。心跳在进程启动时就播种（不是等第一次成功），所以新容器不会
      # 立刻误报，一个从开机起就没跑过的任务也不会因为序列不存在而逃过告警。
      #
      # 阈值下限 120 秒：@TrackedInterval 的任务 5～10 秒一跑，3 × 周期只有 15～30
      # 秒，而抓取和求值都是 15 秒一次 —— 正常运转时求值看到的心跳也会滞后十几
      # 秒，没有下限就会周期性地连响几小时。现有定时任务最短 1 分钟，不受影响。
      - alert: CronJobStalled
        expr: |
          time() - max by (exported_job) (circle_cron_last_success_timestamp_seconds)
            > clamp_min(3 * max by (exported_job) (circle_cron_interval_seconds), 120)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Scheduled job {{ $labels.exported_job }} has not succeeded in 3x its interval'

      # 用「最近一次运行的结果」而不是 rate() 窗口。
      #
      # rate(...[15m]) 配 for: 15m 对每小时/每天的任务打不中：单次失败的增量在
      # for 满足之前就滑出了窗口，而且首次出现 failure 标签时没有前一个零样本
      # 可供 rate() 求增量。storage_audit / refresh_token_cleanup /
      # push_stale_token_cleanup 因此可以每次调度都失败而这条始终静默，只剩
      # 晚得多的 CronJobStalled 兜底。last_result 与执行频率无关。
      #
      # max by (exported_job)：蓝绿期间只要有一个实例把活干成了就不该响。
      # 注册时播种为 1，所以从没跑过的任务不会一开机就报红（那属于停摆，
      # 由 CronJobStalled 负责）。
      - alert: CronJobFailing
        expr: max by (exported_job) (circle_cron_last_result) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Scheduled job {{ $labels.exported_job }} last run failed (including handled failures it swallowed)'

      # 会话撤销队列堵死 = 登出/封禁/盗号撤销静默失效。与 RedisDown 是同一条
      # 安全路径的两个故障点：Redis 挂了撤销 fail-open，队列堵了撤销压根没执行。
      # 两者都必须叫醒人，所以同为 critical。
      - alert: SessionRevocationOutboxStuck
        expr: max(circle_outbox_oldest_age_seconds{queue="session_revocation"}) > 600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Session-revocation outbox stuck >10m — logout/ban/stolen-token revocation is not being applied'

      # gift_card 稳态下 oldestAge 会在 ~120s 附近浮动（处理器有 2 分钟宽限期
      # 才补发），阈值必须显著高于它，否则这条会常年 firing。
      - alert: OutboxBacklogStuck
        expr: max by (queue) (circle_outbox_oldest_age_seconds) > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox {{ $labels.queue }} has work older than 15m — the queue is not draining'

      # collectOutboxDepths 刻意让单个队列探测失败不影响其它队列（整轮 reject
      # 会让所有队列的序列一起消失）。代价是失败的队列会保留上一次读数不动，
      # 而 refresh() 仍然成功、心跳照常前进 —— 队列真在堆积时 gauge 却可能
      # 停在 0 上一直是绿的。新鲜度是那种情况下唯一的信号。
      #
      # 阈值 10 分钟 = 探测周期（1 分钟）的 10 倍，容得下几次瞬时抖动。
      - alert: OutboxProbeStale
        expr: |
          time() - max by (queue) (circle_outbox_last_probe_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox {{ $labels.queue }} depth has not been read for 10m — its pending/dead gauges are stale, not healthy'

      # 不按存量 `> 0` 告警：死信基本只增不减，按存量会在第一行死信之后永久
      # firing —— 正是本文件反复警告的「永远红 → 训练运维忽略告警」。要的是
      # 「过去 1 小时又多了几条」，处理完自动消，存量本身留给大盘看。
      #
      # 但也**不能**用 delta()：它只拿窗口两端的值相减，而这个 gauge 是会回落的
      # —— 文档写明的补救手段 `UPDATE "CoinGift" SET "cardAttempts"=0` 正是把它
      # 打回去。5 → 0（人工重发）→ 1（另一份礼物在同一小时内永久丢失）算出来
      # 是 -4，这条 critical 于是一直哑到那批清零前的样本滑出窗口为止。
      #
      # `当前值 - 窗口内最小值` 对中途的回落免疫：只要现在比这一小时的谷底高，
      # 就说明谷底之后新增过。语义与 delta 一致（存量原地不动满一小时后自动
      # 归零消警），但少了「被一次回落抹掉」这个洞。
      - alert: OutboxDeadLettersAppearing
        expr: |
          max by (queue) (
            circle_outbox_dead{queue!="gift_card"}
              - min_over_time(circle_outbox_dead{queue!="gift_card"}[1h])
          ) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Outbox {{ $labels.queue }} produced new dead letters in the last hour (never retried again)'

      # 单列出来是因为后果不同：钱已经在 sendGift 里强一致结算，卡片打光 60 次
      # 重试后永久丢失 —— 收款人拿不到任何凭证，需要人工对账
      # （UPDATE "CoinGift" SET "cardAttempts"=0 可安全重发，clientMessageId 幂等）。
      # 处理器为此打了 error 级日志，但日志没有接告警通道，这条规则是唯一的叫醒机制。
      #
      # max by (queue) 与上面一致：蓝绿期间两个颜色各报一份同样的 gauge，不聚合
      # 就会为同一件事发两条。
      - alert: GiftCardPermanentlyLost
        expr: |
          max by (queue) (
            circle_outbox_dead{queue="gift_card"}
              - min_over_time(circle_outbox_dead{queue="gift_card"}[1h])
          ) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'A settled coin gift permanently lost its transfer card — manual reconciliation required'

  # 备份自检（deploy/backup/check.sh，每小时第 17 分钟）。结果由 check.sh 写成
  # textfile，备份 overlay 里的 backup-metrics 导出（prometheus.prod.yml 的
  # backup job）。在此之前它只写容器 stdout：备份坏了没有任何人会知道，直到
  # 需要恢复的那一天。
  - name: backups
    rules:
      # 每项检查一条（postgres_archive / backup_freshness / destination_bucket /
      # minio_source），告警里直接看得出坏的是哪一环。
      #
      # 连续两次失败才报（70 分钟内全是 0）：gauge 一整小时保持上一次的结果，for
      # 去不了抖，整点碰上一次离机 S3 抖动就会发一小时的 critical。代价是真故障晚
      # 一小时多才叫；部署后第一次检查就失败时窗口里只有 0，5 分钟就响。修好后
      # 下一次检查一通过就消警，急的话手动跑一次
      # `docker compose ... run --rm backup run check`（它写的是同一个卷）。
      #
      # critical：WAL 归档停了 RPO 就在无限增长，归档失败时 pg_wal 还会一直堆到
      # 撑满磁盘。
      - alert: BackupCheckFailing
        expr: max_over_time(circle_backup_check_success[70m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Backup self-check {{ $labels.check }} is failing — see `docker compose logs backup`'

      # 检查本身停了：调度器挂了，或 check.sh 在写指标之前就退出（比如缺环境变量）。
      # textfile 还在，时间戳不再前进。3 小时 = 至少漏了两次。同一个容器还负责
      # 每天的全量/差异备份和对象镜像，所以这也意味着它们大概率没在跑。
      - alert: BackupCheckStale
        expr: time() - circle_backup_check_last_run_timestamp_seconds > 3 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Backup self-check has not completed for 3h+ — the backup scheduler may be down'

      # 生产上根本没有备份结果：备份 overlay 没叠上（docs/backups.md「Turning it
      # on」），或者 check.sh 从没成功写出过指标。只在有 postgres-exporter 的环境里
      # 判断 —— 那个 job 只存在于生产 overlay，开发机上这条不会响。
      # for 2h：首次部署后，第一次检查最晚一小时后才跑。
      - alert: BackupCheckNotReporting
        expr: |
          absent(circle_backup_check_last_run_timestamp_seconds)
            and on() (up{job="postgres-exporter"} == 1)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: 'No backup self-check results in production — backups are not deployed, or check.sh cannot write its metrics'

      # 仓库里一份完成的备份都没有：check.sh 对此只警告、不导出 backup_freshness
      # （刚启用时第一份还没跑，不算失败）。可要是全量从第一天起就一直失败（OOM、
      # 超时），而 WAL 归档和桶都正常，上面三条都不会响 —— 只有 WAL、没有基础备份，
      # 照样恢复不出来。差异备份每天都跑，没有全量时 pgBackRest 会把它升级成全量，
      # 所以检查一直在正常完成、却 30 小时都拿不到 freshness 结果，就是这种情况。
      - alert: BackupNeverCompleted
        expr: |
          absent(circle_backup_check_success{check="backup_freshness"})
            and on() (time() - circle_backup_check_last_run_timestamp_seconds < 3 * 3600)
        for: 30h
        labels:
          severity: warning
        annotations:
          summary: 'Backup checks run, but the repository still has no completed backup after 30h — the base backup job is failing'

      # 发版时那份加密 pg_dump 没传到主机之外（deploy/offsite-backup.sh）。发版本身
      # 照常完成 —— 本地 dump 已就位 —— 所以此前只有横幅、Actions annotation 和
      # ~/circle_be_backups/.offsite-status，没有任何东西在看。结果由发版脚本经
      # docker exec 写进 backup_metrics 卷，一直保持到下一次发版。warning：持续
      # 备份（上面那组）才是主防线，这一份是它之外的第二份异地副本。
      - alert: ReleaseOffsiteBackupFailed
        expr: circle_release_offsite_backup_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'The last release-time off-host database backup failed — see ~/circle_be_backups/.offsite-status on the host'

  # 外部投递通道与依赖（src/metrics/delivery-metrics.ts、dependency-metrics.ts）。
  # 失败时业务代码只写 external_call_failed 日志：推送凭证过期、JPush 没配 key、
  # SMTP 被限流、存储或 LiveKit 出问题时，此前指标和告警一片安静。都带最小样本量，
  # 低流量时一两次失败不叫人。
  - name: deliveries
    rules:
      # 按 provider 分开算：Expo 和 JPush 的凭证、配额、故障互不相干。分子只算
      # retryable / rejected；dead_token（卸载 App、注册 ID 失效）是正常流失，
      # 算进去的话一批老设备就能把失败率拉过阈值。
      - alert: PushDeliveryFailing
        expr: |
          (
            sum by (provider) (rate(circle_push_deliveries_total{job="circle-be",result=~"retryable|rejected"}[15m]))
              / sum by (provider) (rate(circle_push_deliveries_total{job="circle-be"}[15m]))
          ) > 0.2
          and sum by (provider) (increase(circle_push_deliveries_total{job="circle-be"}[15m])) >= 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Over 20% of {{ $labels.provider }} push deliveries are failing — credentials, quota or provider outage?'

      # 验证码邮件发不出去 = 没人能注册、也没人能用验证码登录。unavailable 是
      # 生产上根本没配 SMTP（UnconfiguredMailer），同样算失败。中继型 SMTP 对错误
      # 收件人是事后退信而不是当场拒收，所以这里的失败基本都是通道本身的问题。
      - alert: EmailCodeSendFailing
        expr: |
          sum(increase(circle_email_code_sends_total{job="circle-be",result=~"failure|unavailable"}[15m])) >= 3
          and (
            sum(rate(circle_email_code_sends_total{job="circle-be",result=~"failure|unavailable"}[15m]))
              / sum(rate(circle_email_code_sends_total{job="circle-be"}[15m]))
          ) > 0.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Most verification-code emails are failing — users cannot register or sign in by email code'

      # 后端直接调用的依赖（src/metrics/dependency-metrics.ts）：对象存储的服务端
      # 读写、LiveKit 建房/拆房。按依赖分开算；not_found（对象不存在）不进分子。
      # 对象存储按 HTTP 请求计，SDK 重试的每一次都算，所以最小失败数取 5 —— 一次
      # 带重试的失败调用不叫人。存储整个连不上时由 ObjectStoreUnreachable 报，
      # 这条被它抑制。
      #
      # 排除 HeadBucket：/readyz 和抓取每分钟都在做可达性探测（它归
      # circle_object_store_up 管），每 15 分钟固定贡献约 30 次成功。算进分母的话，
      # 「凭证还能 HeadBucket、桶策略却拒掉服务端写入」这种这条告警最该抓的情况，
      # 几次失败就被稀释掉了。
      - alert: DependencyRequestsFailing
        expr: |
          sum by (dependency) (increase(circle_dependency_requests_total{job="circle-be",operation!="HeadBucket",result="failure"}[15m])) >= 5
          and (
            sum by (dependency) (rate(circle_dependency_requests_total{job="circle-be",operation!="HeadBucket",result="failure"}[15m]))
              / sum by (dependency) (rate(circle_dependency_requests_total{job="circle-be",operation!="HeadBucket"}[15m]))
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Over 20% of backend requests to {{ $labels.dependency }} are failing — credentials, bucket policy or an outage?'

  # 监控自身的存活证明。
  - name: meta
    rules:
      - alert: AlertmanagerNotificationFailures
        expr: increase(alertmanager_notifications_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Alertmanager failed to deliver one or more notifications in the last 10m'

      - alert: AlertmanagerConfigReloadFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Alertmanager rejected its most recent configuration reload'

      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus failed to evaluate one or more rules in the last 10m'

      # Alloy v1.19.2 exposes this counter for entries it permanently drops.
      # The series exists only when the optional logs overlay is running.
      - alert: LogPipelineDroppedEntries
        expr: increase(loki_write_dropped_entries_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Alloy permanently dropped log entries in the last 10m'

      # A one-off retry is normal. Remaining above zero for longer than the
      # lookback means pushes keep failing and the sender WAL can grow even
      # while Loki and Alloy both remain scrape-healthy.
      - alert: LogPipelineDeliveryStalled
        expr: increase(loki_write_batch_retries_total[10m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Alloy has continuously retried log delivery for at least 15m'

      # Loki 的日志告警（monitoring/loki/rules/fake/*.yml）由 Loki 自己的 ruler 直接
      # 发给 Alertmanager，不经过 Prometheus。Alertmanager 没加入 logs 网络、或拒收时，
      # 这几条告警会一直发不出去，而 Loki 和 Alloy 的抓取照样健康。两个计数只在启用
      # 了日志 overlay 时存在。
      - alert: LokiRulerNotificationsFailing
        expr: |
          sum(increase(loki_prometheus_notifications_errors_total[10m])) > 0
          or sum(increase(loki_prometheus_notifications_dropped_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Loki could not deliver log-based alerts to Alertmanager in the last 10m — is Alertmanager on the logs network?'

      # 永远 firing，专门路由到**外部**心跳服务（healthchecks.io 等）。
      #
      # 整套监控栈和被监控对象在同一台机器上：机器宕机、磁盘写满、网络断开时，
      # Prometheus / Alertmanager / blackbox-exporter 一起没了，Discord 一条消息
      # 都不会有 —— 而 HostDiskFilling、HighMemory 这些恰恰是「真触发时离整机不可用
      # 不远了」的告警。这条是唯一能覆盖「监控自己死了」的机制：外部服务**收不到**
      # 心跳就报警，方向和其他所有告警相反。
      #
      # 不要给它加 for:，也不要在 Alertmanager 里把它并进普通 receiver。
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: 'Alerting pipeline heartbeat — an external service pages when this STOPS arriving'

  # 自建聊天容量与宿主机资源。
  - name: capacity
    rules:
      - alert: ChatAckLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(chat_message_ack_duration_seconds_bucket{action="send"}[5m])
            )) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Self-hosted chat send ACK p95 > 500ms for 5m'

      - alert: ChatBroadcastLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(chat_broadcast_duration_seconds_bucket{action="message"}[5m])
            )) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Self-hosted chat message broadcast p95 > 200ms for 5m'

      # Budgets are enforced per process and per pool. Do not sum across
      # blue/green instances: an idle replica must not hide a saturated one.
      - alert: GatewayCapacityNearLimit
        expr: circle_gateway_capacity_used / circle_gateway_capacity_limit > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Gateway {{ $labels.instance }} {{ $labels.pool }} budget above 80% for 2m'

      - alert: GatewayCapacityRejecting
        expr: sum by (instance, pool) (rate(circle_gateway_rejections_total{reason="capacity"}[5m])) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Gateway {{ $labels.instance }} {{ $labels.pool }} rejects more than 1 request or connection per second for 2m'

      - alert: GatewayAuthTimeoutSpike
        expr: sum by (instance, pool) (rate(circle_gateway_rejections_total{reason="auth_timeout"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Gateway {{ $labels.instance }} {{ $labels.pool }} authentication timeouts exceed 5/s for 5m'

      - alert: ApiAuthFailureSpike
        expr: sum(rate(http_requests_total{job="circle-be",status_code=~"401|403"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'API 401/403 responses exceed 10/s for 5m; investigate abuse or a client authentication regression'

      - alert: ApiRateLimitSpike
        expr: sum(rate(http_requests_total{job="circle-be",status_code="429"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'API rate-limited responses exceed 5/s for 5m; check shared NAT and abusive clients'

      - alert: ChatAuthFailureSpike
        expr: sum(rate(chat_auth_failures_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Chat authentication failures exceed 5/s for 5m; investigate abuse or a client authentication regression'

      - alert: ChatRateLimitSpike
        expr: sum(rate(chat_messages_received_total{result="rate_limited"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Self-hosted chat rate-limited events > 5/s for 5m'

      # A flood or group broadcast can exhaust a container before the backend
      # itself reports high latency. Keep this resource-level guardrail.
      # 分母加 `> 0` 是必须的 —— 无上限容器的 limit 为 0，不过滤会得到 +Inf 从而永远告警。
      #
      # 分子用 working_set 而不是 usage：container_memory_usage_bytes 把可回收的
      # page cache 也算进去，数据库/消息队列稳定运行时它本来就会贴着上限（内核在
      # 内存紧张时自然回收，不会 OOM）。用 usage 会让 mongo/kafka/postgres 常驻红色 ——
      # 正是本文件反复警告的「永远红 → 训练运维忽略告警」。working_set 是 OOM killer
      # 实际参考的量，逼近上限才真的意味着要被杀。
      - alert: ContainerMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name!=""}
            / (container_spec_memory_limit_bytes{name!=""} > 0) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} is at >90% of its memory limit'

      # 崩溃循环：restart: unless-stopped 会把挂掉的容器一遍遍拉起来，每次都短暂
      # 存活，按抓取时刻看的 up / 健康检查常常是绿的。被 OOM killer 反复杀掉也一样。
      #
      # 不能用 changes(container_start_time_seconds)：cAdvisor 导出的是 docker inspect
      # 的 Created（创建时间），同一个容器重启时不变。能用的是 cAdvisor 给重启过的
      # 容器打的 restartcount 标签（container_label_restartcount，见 v0.52.1 的
      # container/docker/handler.go）：每重启一次就换一条新序列。所以数 15 分钟里
      # 同一个名字出现过几条序列，减 1 就是重启次数。发版重建容器只多一条，手工
      # docker restart 一两次也不到阈值。
      #
      # 盲区：存活不到一个抓取间隔（15s）的那几次抓不到 —— 启动即崩的服务主要靠
      # 各自的 Down / NoTarget / PublicEndpointDown 兜。
      - alert: ContainerRestartLoop
        expr: count by (name) (count_over_time(container_start_time_seconds{name!=""}[15m])) - 1 >= 3
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} restarted about {{ $value }} times in 15m (crash loop or OOM kills?)'

      # Containers without a configured limit do not trigger the rule above;
      # use host CPU as a fallback for runaway workloads.
      - alert: HostCpuSaturated
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Host CPU > 90% for 10m (message flood or runaway container?)'

      # The second common capacity failure is disk exhaustion: database growth
      # and container logs can consume the same host as the API.
      # fstype 白名单而不是黑名单:snap 包/只读镜像会让 node_exporter 把
      # squashfs 报成 100% 已用、可用 0 字节。只排除 tmpfs|overlay 的话,
      # 装了 snap 的主机上这条告警会永久处于 firing —— 运维很快就学会无视它,
      # 那本来是用来发现 Kafka/Mongo 撑满磁盘的。这里只保留可写的持久化文件系统。
      # readonly 的挂载(只读 bind、恢复模式)同样排除:它们不会「填满」。
      - alert: HostDiskFilling
        expr: |
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"}
            / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"} < 0.15
          and on(instance, mountpoint) node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} below 15% free'

      # 剩 5% 时只差一次日志风暴或一次大迁移：Postgres 写不进 WAL 会直接停库，
      # winston 的日志轮转也没有总量上限。选择器与上面那条完全相同。
      # 两档用不同的告警名（文件末尾那条通用的同名抑制管不到），同一块盘的
      # warning 由 alertmanager.yml 里按 instance + mountpoint 配对的抑制压掉。
      - alert: HostDiskNearlyFull
        expr: |
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"}
            / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"} < 0.05
          and on(instance, mountpoint) node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} below 5% free — database and log writes are about to fail'

      # 趋势：按最近 6 小时的斜率，24 小时内会写满。阈值告警只在快满时才响，
      # 一次失控的日志或一张暴涨的表在那之前就能看出来。只看剩余不到 40% 的盘：
      # 空盘上一次大文件写入也会让斜率短暂为负，那不值得叫人。
      - alert: HostDiskWillFillWithin24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"}[6h], 24 * 3600) < 0
          and on(instance, mountpoint)
            node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"}
              / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"} < 0.4
          and on(instance, mountpoint) node_filesystem_readonly == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} is on track to fill within 24h at the current write rate'

      # inode 用完和磁盘写满后果一样（写不进任何新文件），但 df 的百分比看不出来：
      # 大量小文件（日志切片、上传缓存）能在空间充足时先耗尽 inode。btrfs/zfs
      # 动态分配 inode、报告总数为 0，用 > 0 排除。两档、两个告警名，同盘抑制同上。
      - alert: HostInodesLow
        expr: |
          node_filesystem_files_free{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"}
            / (node_filesystem_files{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"} > 0) < 0.10
          and on(instance, mountpoint) node_filesystem_readonly == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} has less than 10% of its inodes left'

      - alert: HostInodesNearlyExhausted
        expr: |
          node_filesystem_files_free{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"}
            / (node_filesystem_files{fstype=~"ext4|xfs|btrfs|zfs|ext3", mountpoint!~"/(boot|snap)(/.*)?"} > 0) < 0.03
          and on(instance, mountpoint) node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} is almost out of inodes — new files (logs, uploads, WAL) will fail to be created'

  # 数据库与缓存。指标名与标签均已对着 postgres-exporter v0.19.0 /
  # redis_exporter v1.83.0 的真实输出核对过。
  - name: datastores
    rules:
      # pg_up 是 exporter 自己判定的「连得上库吗」，与 up{job=...}（能不能连上
      # exporter）是两回事：exporter 活着而数据库挂了时，只有这条会响。
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL is unreachable from postgres-exporter'

      # 两边都套 max() 是必须的，不是风格问题：
      # pg_settings_max_connections 带 server="host:port" 标签，而
      # pg_stat_database_numbackends **不带**。直接相除标签集不一致，
      # 向量匹配失败、结果恒为空 —— 一条永远不会触发的告警，比没有更糟。
      # max() 去掉标签后两边都是 {}，才能匹配上。
      - alert: PostgresConnectionsNearMax
        expr: |
          sum(pg_stat_database_numbackends) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL is using >80% of max_connections'

      # 连接被开着但事务不结束 —— 典型的忘记 commit / 长事务泄漏。它会一直占
      # 着连接名额，是 PostgresConnectionsNearMax 最常见的前因。
      - alert: PostgresIdleInTransaction
        expr: |
          sum(pg_stat_activity_count{state="idle in transaction"}) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'More than 5 backends stuck idle-in-transaction for 10m'

      # 连接池排队 —— postgres-exporter **看不到**的那一面。
      #
      # 池排队发生在 Node 进程内部：从 Postgres 视角连接数没涨、没有慢查询、
      # 没有锁等待，而应用侧请求已经在 connectionTimeoutMillis(10s)上排队。
      # 等 BackendHighLatencyP95 响的时候早就晚了。
      #
      # 池只有 10 个（DATABASE_POOL_MAX 默认值），而圈子列表这类接口的
      # findMany + count 是并发发出的、一个请求就占两个连接 —— 这条告警针对的
      # 正是那种「Postgres 一切正常但服务已经在排队」的场景。
      - alert: DbPoolQueueing
        expr: max(circle_db_pool_waiting) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Requests are queueing for a pg connection — the pool, not Postgres, is the bottleneck'

      # 排队深度持续超过池容量的一半：后续请求会陆续撞上 10s 取连接超时并
      # 变成 5xx。这时已经不是「慢」而是「开始掉请求」。
      # 阈值跟着 DATABASE_POOL_MAX 走，不写死。池配成 4 时三个等待者已经是严重
      # 饱和却打不中写死的 5；配成 100 时六个等待者又会造成没理由的 critical。
      # 两边都套 max() 去标签，否则两条序列标签集不同、向量匹配失败恒为空。
      - alert: DbPoolExhausted
        expr: |
          max by (instance) (circle_db_pool_waiting)
            > max by (instance) (circle_db_pool_max) * 0.5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'pg connection pool is deeply saturated — requests are about to hit the 10s acquire timeout and fail'

      - alert: RedisExporterDown
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Redis is unreachable from redis-exporter'

      # 生产 Redis 跑的是 maxmemory-policy noeviction（见 docker-compose.prod.yml）：
      # 撑到上限不会淘汰旧键，而是让**写入直接报错**。会话撤销依赖 Redis 写入，
      # 所以这等价于 RedisDown 那条描述的 fail-open —— 同为 critical。
      # 分母加 > 0：未设 maxmemory 时该指标为 0，不过滤会得到 +Inf 永远告警
      # （与 ContainerMemoryNearLimit 同一个坑）。
      - alert: RedisMemoryNearLimit
        expr: redis_memory_used_bytes / (redis_memory_max_bytes > 0) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Redis is at >90% of maxmemory — with noeviction, writes start failing (session revocation included)'

      - alert: RedisRejectingConnections
        expr: increase(redis_rejected_connections_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Redis rejected connections in the last 10m (maxclients reached)'

      # 对象存储连不上（UploadService.objectStoreReachable：HeadBucket，30 秒缓存、
      # 2 秒超时）。/readyz 有意不因它变红 —— 存储故障在每个副本上都一样，拿它
      # 判 not-ready 会把聊天、登录这些不依赖存储的功能一起摘掉。所有用户发图、
      # 看图都会失败，所以 critical。min：只要有一个在服务的实例连不上就响。
      - alert: ObjectStoreUnreachable
        expr: min(circle_object_store_up) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Object storage is unreachable — media uploads and reads are failing for every user'

  - name: host
    rules:
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Host memory usage > 85% for 5m'

      # #87：私有笔记媒体的桶策略未确认应用 —— notes/* 可能匿名可读。
      # /readyz 有意不因此变红（策略失败在所有副本相同，fail-closed = 全站故障），
      # 这条告警是唯一的叫醒机制。
      - alert: ObjectStorePolicyUnconfirmed
        expr: max(circle_object_store_policy_unconfirmed) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Private-media bucket policy unconfirmed — notes/* may be anonymously readable'

      # 固定验证码旁路在 production 生效 = 允许名单里的账号免密可登。
      # 它只靠三个环境变量开启，没有任何请求路径会暴露它，因此除了启动日志
      # 就只有这条告警能发现「预生产测试窗口结束后忘了关」。
      # max 而不是 min：只要有一个实例带着旁路在服务就必须响。
      - alert: EmailCodeBypassActive
        expr: max(circle_email_code_bypass_active) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Fixed email verification code is live — allowlisted accounts need no password'

      # #102：会话撤销 fail-open 依赖 Redis。Redis 挂掉期间登出/封禁/盗号撤销
      # 全部静默失效（HTTP 与 WS 同步失效），必须有人处理。
      - alert: RedisDown
        # round 2 review：min 而不是 max —— 蓝绿切换/单色坏配置时，只要有
        # 一个仍在服务的实例丢了 Redis（撤销 fail-open），就必须响。
        expr: min(circle_redis_up) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Redis is down — session revocation is silently fail-open while this fires'
