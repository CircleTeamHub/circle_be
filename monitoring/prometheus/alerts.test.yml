# promtool 规则单测。跑法（CI 里自动跑）：
#
#   docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/rules:ro" \
#     prom/prometheus:v3.7.3 test rules /rules/alerts.test.yml
#
# 这里喂的是合成时序、断言的是「在某个时刻这条告警到底响不响」—— 与
# test/prometheus-alerts.spec.mjs 的正则断言互补：那边钉的是规则的写法
# （用了哪个选择器、有没有用 delta），这边钉的是它的**行为**。
#
# 阈值类改动务必在这里补一条：`promtool check rules` 只查语法，一条语法完全
# 正确但永远打不中的规则它照样报 SUCCESS。

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # ── 连接池：阈值必须跟着 DATABASE_POOL_MAX 走 ──────────────────────────
  - interval: 1m
    name: 小池子上适度的排队也是严重饱和
    input_series:
      - series: 'circle_db_pool_waiting'
        values: '3+0x20'
      - series: 'circle_db_pool_max'
        values: '4+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: DbPoolExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#dbpoolexhausted
              summary: 'pg connection pool is deeply saturated — requests are about to hit the 10s acquire timeout and fail'

  - interval: 1m
    name: 大池子上同样的等待数不该 critical
    input_series:
      - series: 'circle_db_pool_waiting'
        values: '6+0x20'
      - series: 'circle_db_pool_max'
        values: '100+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: DbPoolExhausted
        exp_alerts: []
      # 但任何持续排队都值得一条 warning，与池大小无关。
      - eval_time: 10m
        alertname: DbPoolQueueing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#dbpoolqueueing
              summary: 'Requests are queueing for a pg connection — the pool, not Postgres, is the bottleneck'

  - interval: 1m
    name: 蓝绿池容量不同也必须逐实例比较
    input_series:
      - series: 'circle_db_pool_waiting{instance="blue"}'
        values: '3+0x20'
      - series: 'circle_db_pool_max{instance="blue"}'
        values: '4+0x20'
      - series: 'circle_db_pool_waiting{instance="green"}'
        values: '0+0x20'
      - series: 'circle_db_pool_max{instance="green"}'
        values: '100+0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: DbPoolExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: blue
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#dbpoolexhausted
              summary: 'pg connection pool is deeply saturated — requests are about to hit the 10s acquire timeout and fail'

  # ── 定时任务失败：必须与执行频率无关 ─────────────────────────────────
  - interval: 1m
    name: 每天一次的任务失败一次就要报（rate 窗口做不到）
    input_series:
      # 每天 4 点的任务：跑了一次、失败了，之后 24 小时不会再有新样本。
      # 旧写法 rate(...[15m]) 配 for: 15m 在这里必然打不中 —— 单次失败的增量
      # 在 for 满足之前就滑出了窗口。
      - series: 'circle_cron_last_result{exported_job="storage_audit"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: CronJobFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: storage_audit
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#cronjobfailing
              summary: 'Scheduled job storage_audit last run failed (including handled failures it swallowed)'

  - interval: 1m
    name: 恢复成功后立刻停止告警
    input_series:
      - series: 'circle_cron_last_result{exported_job="storage_audit"}'
        values: '0+0x20 1+0x20'
    alert_rule_test:
      - eval_time: 39m
        alertname: CronJobFailing
        exp_alerts: []

  - interval: 1m
    name: 蓝绿期间只要有一个实例干成了就不报
    input_series:
      - series: 'circle_cron_last_result{exported_job="chat_burn_sweeper",color="blue"}'
        values: '0+0x30'
      - series: 'circle_cron_last_result{exported_job="chat_burn_sweeper",color="green"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: CronJobFailing
        exp_alerts: []

  - interval: 1m
    name: 共享抓取 job 下健康任务不能掩盖失败任务
    input_series:
      - series: 'circle_cron_last_result{job="circle-be",exported_job="storage_audit"}'
        values: '0+0x30'
      - series: 'circle_cron_last_result{job="circle-be",exported_job="refresh_token_cleanup"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CronJobFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: storage_audit
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#cronjobfailing
              summary: 'Scheduled job storage_audit last run failed (including handled failures it swallowed)'

  # ── 心跳：阈值按各任务自己的周期缩放 ─────────────────────────────────
  - interval: 1m
    name: 每分钟的任务停摆几分钟就报，每天的任务不会因此误报
    input_series:
      # 心跳停在 t=0，两个任务的周期不同。
      - series: 'circle_cron_last_success_timestamp_seconds{exported_job="per_minute"}'
        values: '0+0x60'
      - series: 'circle_cron_interval_seconds{exported_job="per_minute"}'
        values: '60+0x60'
      - series: 'circle_cron_last_success_timestamp_seconds{exported_job="daily"}'
        values: '0+0x60'
      - series: 'circle_cron_interval_seconds{exported_job="daily"}'
        values: '86400+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: CronJobStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: per_minute
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#cronjobstalled
              summary: 'Scheduled job per_minute has not succeeded in 3x its interval'

  - interval: 1m
    name: 同周期健康任务不能掩盖停摆任务
    input_series:
      - series: 'circle_cron_last_success_timestamp_seconds{job="circle-be",exported_job="stalled"}'
        values: '0+0x30'
      - series: 'circle_cron_interval_seconds{job="circle-be",exported_job="stalled"}'
        values: '60+0x30'
      - series: 'circle_cron_last_success_timestamp_seconds{job="circle-be",exported_job="healthy"}'
        values: '0+60x30'
      - series: 'circle_cron_interval_seconds{job="circle-be",exported_job="healthy"}'
        values: '60+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: CronJobStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: stalled
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#cronjobstalled
              summary: 'Scheduled job stalled has not succeeded in 3x its interval'

  - interval: 1m
    name: 同一任务蓝绿心跳有一个恢复就不报
    input_series:
      - series: 'circle_cron_last_success_timestamp_seconds{exported_job="sweeper",color="blue"}'
        values: '0+0x30'
      - series: 'circle_cron_last_success_timestamp_seconds{exported_job="sweeper",color="green"}'
        values: '0+60x30'
      - series: 'circle_cron_interval_seconds{exported_job="sweeper",color="blue"}'
        values: '60+0x30'
      - series: 'circle_cron_interval_seconds{exported_job="sweeper",color="green"}'
        values: '60+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: CronJobStalled
        exp_alerts: []

  # ── 监控栈自检 ──────────────────────────────────────────────────────
  - interval: 1m
    name: Alertmanager 通知失败计数增长并在窗口过期后恢复
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="clientError"}'
        values: '0+0x2 1+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: AlertmanagerNotificationFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              integration: webhook
              reason: clientError
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#alertmanagernotificationfailures
              summary: 'Alertmanager failed to deliver one or more notifications in the last 10m'
      - eval_time: 20m
        alertname: AlertmanagerNotificationFailures
        exp_alerts: []

  - interval: 1m
    name: Alertmanager 配置重载失败持续后触发并在成功后恢复
    input_series:
      - series: 'alertmanager_config_last_reload_successful'
        values: '0+0x10 1+0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#alertmanagerconfigreloadfailed
              summary: 'Alertmanager rejected its most recent configuration reload'
      - eval_time: 12m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts: []

  - interval: 1m
    name: Prometheus 规则评估失败计数增长并在窗口过期后恢复
    input_series:
      - series: 'prometheus_rule_evaluation_failures_total{rule_group="/etc/prometheus/alerts.yml;meta"}'
        values: '0+0x2 1+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              rule_group: /etc/prometheus/alerts.yml;meta
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#prometheusruleevaluationfailures
              summary: 'Prometheus failed to evaluate one or more rules in the last 10m'
      - eval_time: 20m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts: []

  - interval: 1m
    name: 监控自检指标为零或可选日志栈缺席时不报
    input_series:
      - series: 'alertmanager_notifications_failed_total{integration="webhook",reason="clientError"}'
        values: '0+0x30'
      - series: 'alertmanager_config_last_reload_successful'
        values: '1+0x30'
      - series: 'prometheus_rule_evaluation_failures_total'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlertmanagerNotificationFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: AlertmanagerConfigReloadFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: PrometheusRuleEvaluationFailures
        exp_alerts: []
      - eval_time: 20m
        alertname: LogPipelineDroppedEntries
        exp_alerts: []

  - interval: 1m
    name: Grafana 和可选日志目标宕机触发 TargetDown
    input_series:
      - series: 'up{job="logs-pipeline",instance="alloy:12345",component="alloy"}'
        values: '0+0x10'
      - series: 'up{job="grafana",instance="grafana:3000"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: logs-pipeline
              instance: alloy:12345
              component: alloy
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#targetdown
              summary: 'Scrape target logs-pipeline is down'
          - exp_labels:
              severity: critical
              job: grafana
              instance: grafana:3000
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#targetdown
              summary: 'Scrape target grafana is down'

  - interval: 1m
    name: Alloy 丢弃计数单次增长触发并在窗口过期后恢复
    input_series:
      - series: 'loki_write_dropped_entries_total{component_id="loki.write.local"}'
        values: '0+0x2 1+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: LogPipelineDroppedEntries
        exp_alerts:
          - exp_labels:
              severity: warning
              component_id: loki.write.local
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#logpipelinedroppedentries
              summary: 'Alloy permanently dropped log entries in the last 10m'
      - eval_time: 20m
        alertname: LogPipelineDroppedEntries
        exp_alerts: []

  - interval: 1m
    name: Loki 的日志告警发不到 Alertmanager 时触发并在窗口过期后恢复
    input_series:
      - series: 'loki_prometheus_notifications_errors_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: '0+0x2 1+0x30'
      - series: 'loki_prometheus_notifications_dropped_total{alertmanager="http://alertmanager:9093/api/v2/alerts",user="fake"}'
        values: '0+0x32'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiRulerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#lokirulernotificationsfailing
              summary: 'Loki could not deliver log-based alerts to Alertmanager in the last 10m — is Alertmanager on the logs network?'
      - eval_time: 20m
        alertname: LokiRulerNotificationsFailing
        exp_alerts: []

  - interval: 1m
    name: Loki 丢弃日志告警同样触发
    input_series:
      - series: 'loki_prometheus_notifications_errors_total{user="fake"}'
        values: '0+0x20'
      - series: 'loki_prometheus_notifications_dropped_total{user="fake"}'
        values: '0+0x2 3+0x18'
    alert_rule_test:
      - eval_time: 10m
        alertname: LokiRulerNotificationsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#lokirulernotificationsfailing
              summary: 'Loki could not deliver log-based alerts to Alertmanager in the last 10m — is Alertmanager on the logs network?'

  - interval: 1m
    name: Alloy 持续重试且目标健康时触发
    input_series:
      - series: 'loki_write_batch_retries_total{component_id="loki.write.local"}'
        values: '0+1x40'
      - series: 'loki_write_dropped_entries_total{component_id="loki.write.local"}'
        values: '0+0x40'
      - series: 'up{job="logs-pipeline",component="alloy"}'
        values: '1+0x40'
      - series: 'up{job="logs-pipeline",component="loki"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: LogPipelineDeliveryStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              component_id: loki.write.local
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#logpipelinedeliverystalled
              summary: 'Alloy has continuously retried log delivery for at least 15m'

  # ── outbox 探测新鲜度 ────────────────────────────────────────────────
  - interval: 1m
    name: 探测持续失败的队列即使读数是 0 也要报
    input_series:
      # 这正是「一个队列的探测一直失败」的形状：时间戳停住不动，
      # 而 pending 保留着上一次读到的 0，看上去一片健康。
      - series: 'circle_outbox_last_probe_timestamp_seconds{queue="gift_card"}'
        values: '0+0x40'
      - series: 'circle_outbox_pending{queue="gift_card"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: OutboxProbeStale
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: gift_card
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#outboxprobestale
              summary: 'Outbox gift_card depth has not been read for 10m — its pending/dead gauges are stale, not healthy'

  - interval: 1m
    name: 正常刷新的队列不报
    input_series:
      # 时间戳每分钟跟着推进。
      - series: 'circle_outbox_last_probe_timestamp_seconds{queue="notification_push"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: OutboxProbeStale
        exp_alerts: []

  # ── 死信:必须对「人工清零」造成的回落免疫 ────────────────────────────
  - interval: 1m
    name: 存量被人工重发清零后,同一小时内新增的永久丢失仍然要报
    input_series:
      # 5 条积压的死信 → 运维照文档执行
      # `UPDATE "CoinGift" SET "cardAttempts"=0` 把它们放回重试 → 另一份礼物
      # 打光 60 次重试、永久丢失。delta() 在这里算出 -4,这条 critical 会一直
      # 哑到清零前的样本滑出 1 小时窗口 —— 钱已结算、凭证没了,没人被叫醒。
      - series: 'circle_outbox_dead{queue="gift_card"}'
        values: '5+0x10 0+0x10 1+0x25'
    alert_rule_test:
      - eval_time: 30m
        alertname: GiftCardPermanentlyLost
        exp_alerts:
          - exp_labels:
              severity: critical
              queue: gift_card
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#giftcardpermanentlylost
              summary: 'A settled coin gift permanently lost its transfer card — manual reconciliation required'

  - interval: 1m
    name: 新增的死信要报,而放着不动的存量满一小时后自动消
    input_series:
      # t=6 冒出 3 条死信,此后原地不动。
      - series: 'circle_outbox_dead{queue="notification_push"}'
        values: '0+0x5 3+0x120'
    alert_rule_test:
      # 刚出现:报。
      - eval_time: 15m
        alertname: OutboxDeadLettersAppearing
        exp_alerts:
          - exp_labels:
              severity: warning
              queue: notification_push
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#outboxdeadlettersappearing
              summary: 'Outbox notification_push produced new dead letters in the last hour (never retried again)'
      # 存量原地不动满一小时:自动消,不留一条永远红的告警。
      - eval_time: 90m
        alertname: OutboxDeadLettersAppearing
        exp_alerts: []

  - interval: 1m
    name: 蓝绿期间同一件事只发一条
    input_series:
      # 两个颜色各报一份同样的 gauge。不按 queue 聚合就会发两条。
      - series: 'circle_outbox_dead{queue="gift_card",instance="blue"}'
        values: '0+0x5 1+0x30'
      - series: 'circle_outbox_dead{queue="gift_card",instance="green"}'
        values: '0+0x5 1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GiftCardPermanentlyLost
        exp_alerts:
          - exp_labels:
              severity: critical
              queue: gift_card
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#giftcardpermanentlylost
              summary: 'A settled coin gift permanently lost its transfer card — manual reconciliation required'

  # ── 公网可达性：blackbox-exporter 从用户的路径探测 ─────────────────────
  - interval: 1m
    name: 公网入口持续探测失败才叫醒人
    input_series:
      - series: 'probe_success{job="blackbox-http",instance="https://api.example.com/healthz",component="api"}'
        values: '1+0x2 0+0x10'
    alert_rule_test:
      # 3m 起失败，for: 2m 之内还只是 pending。
      - eval_time: 4m
        alertname: PublicEndpointDown
        exp_alerts: []
      - eval_time: 6m
        alertname: PublicEndpointDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-http
              instance: https://api.example.com/healthz
              component: api
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#publicendpointdown
              summary: 'Public endpoint https://api.example.com/healthz is failing its probe (DNS, TLS, Caddy or the service behind it)'

  - interval: 1m
    name: 单次探测抖动不报
    input_series:
      - series: 'probe_success{job="blackbox-http",instance="https://api.example.com/healthz",component="api"}'
        values: '1 1 0 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 6m
        alertname: PublicEndpointDown
        exp_alerts: []

  - interval: 1m
    name: 证书剩不到 14 天先 warning，剩不到 3 天另发一条 critical
    input_series:
      # promtool 的时间轴从 Unix 纪元开始，time() 在第 t 分钟就是 60t 秒，
      # 所以这里直接写「从现在算起还剩多少秒」。
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-http",instance="https://api.example.com/healthz",component="api"}'
        values: '864000+0x60'
      - series: 'probe_ssl_earliest_cert_expiry{job="blackbox-http",instance="https://admin.example.com/",component="admin"}'
        values: '172800+0x60'
    alert_rule_test:
      # 剩 10 天和剩 2 天的证书都低于 14 天：各自一条 warning。
      - eval_time: 45m
        alertname: TlsCertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox-http
              instance: https://api.example.com/healthz
              component: api
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#tlscertificateexpiringsoon
              summary: 'TLS certificate for https://api.example.com/healthz expires in less than 14 days — automatic renewal has been failing'
          - exp_labels:
              severity: warning
              job: blackbox-http
              instance: https://admin.example.com/
              component: admin
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#tlscertificateexpiringsoon
              summary: 'TLS certificate for https://admin.example.com/ expires in less than 14 days — automatic renewal has been failing'
      # 只有剩 2 天的那张升级。Alertmanager 按 instance 用它压掉同一张证书的
      # warning；api 那张的 warning 照常发出，不会被别的域名连带静音。
      - eval_time: 45m
        alertname: TlsCertificateExpiryImminent
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-http
              instance: https://admin.example.com/
              component: admin
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#tlscertificateexpiryimminent
              summary: 'TLS certificate for https://admin.example.com/ expires in less than 3 days — renew it now or clients will refuse to connect'

  - interval: 1m
    name: exporter 在跑却没有任何探测目标要报
    input_series:
      - series: 'up{job="blackbox-exporter",instance="blackbox-exporter:9115"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PublicProbeNotConfigured
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox-http
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#publicprobenotconfigured
              summary: 'blackbox-exporter is running but nothing is being probed — create monitoring/prometheus/probe-targets/public.yml'

  - interval: 1m
    name: 开发环境没有 exporter 就不报
    input_series:
      - series: 'up{job="circle-be",instance="host.docker.internal:3000"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PublicProbeNotConfigured
        exp_alerts: []

  - interval: 1m
    name: 配了探测目标就不报
    input_series:
      - series: 'up{job="blackbox-exporter",instance="blackbox-exporter:9115"}'
        values: '1+0x30'
      - series: 'probe_success{job="blackbox-http",instance="https://api.example.com/healthz",component="api"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: PublicProbeNotConfigured
        exp_alerts: []

  # Gateway protection, sustained abuse, recovery and quiet traffic.
  - name: 网关预算按进程告警且恢复后清除
    interval: 1m
    input_series:
      - series: circle_gateway_capacity_used{job="circle-be",instance="blue",pool="chat_connections"}
        values: 1700+0x10 0+0x20
      - series: circle_gateway_capacity_limit{job="circle-be",instance="blue",pool="chat_connections"}
        values: 2000+0x31
      - series: circle_gateway_capacity_used{job="circle-be",instance="green",pool="chat_connections"}
        values: 1000+0x10 0+0x20
      - series: circle_gateway_capacity_limit{job="circle-be",instance="green",pool="chat_connections"}
        values: 2000+0x31
    alert_rule_test:
      - eval_time: 1m
        alertname: GatewayCapacityNearLimit
        exp_alerts: []
      - eval_time: 3m
        alertname: GatewayCapacityNearLimit
        exp_alerts:
          - exp_labels:
              severity: warning
              job: circle-be
              instance: blue
              pool: chat_connections
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#gatewaycapacitynearlimit
              summary: Gateway blue chat_connections budget above 80% for 2m
      - eval_time: 15m
        alertname: GatewayCapacityNearLimit
        exp_alerts: []
  - name: GatewayCapacityRejecting 持续异常触发且恢复后清除
    interval: 1m
    input_series:
      - series: circle_gateway_rejections_total{instance="blue",pool="http",reason="capacity"}
        values: 0+120x15 1800+0x20
    alert_rule_test:
      - eval_time: 1m
        alertname: GatewayCapacityRejecting
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayCapacityRejecting
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: blue
              pool: http
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#gatewaycapacityrejecting
              summary: Gateway blue http rejects more than 1 request or connection per second for 2m
      - eval_time: 25m
        alertname: GatewayCapacityRejecting
        exp_alerts: []
  - name: GatewayAuthTimeoutSpike 持续异常触发且恢复后清除
    interval: 1m
    input_series:
      - series: circle_gateway_rejections_total{instance="blue",pool="realtime_pending",reason="auth_timeout"}
        values: 0+360x15 5400+0x20
    alert_rule_test:
      - eval_time: 1m
        alertname: GatewayAuthTimeoutSpike
        exp_alerts: []
      - eval_time: 10m
        alertname: GatewayAuthTimeoutSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: blue
              pool: realtime_pending
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#gatewayauthtimeoutspike
              summary: Gateway blue realtime_pending authentication timeouts exceed 5/s for 5m
      - eval_time: 25m
        alertname: GatewayAuthTimeoutSpike
        exp_alerts: []
  - name: ApiAuthFailureSpike 持续异常触发且恢复后清除
    interval: 1m
    input_series:
      - series: http_requests_total{job="circle-be",status_code="401"}
        values: 0+660x15 9900+0x20
    alert_rule_test:
      - eval_time: 1m
        alertname: ApiAuthFailureSpike
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiAuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#apiauthfailurespike
              summary: API 401/403 responses exceed 10/s for 5m; investigate abuse or a client authentication regression
      - eval_time: 25m
        alertname: ApiAuthFailureSpike
        exp_alerts: []
  - name: ApiRateLimitSpike 持续异常触发且恢复后清除
    interval: 1m
    input_series:
      - series: http_requests_total{job="circle-be",status_code="429"}
        values: 0+360x15 5400+0x20
    alert_rule_test:
      - eval_time: 1m
        alertname: ApiRateLimitSpike
        exp_alerts: []
      - eval_time: 10m
        alertname: ApiRateLimitSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#apiratelimitspike
              summary: API rate-limited responses exceed 5/s for 5m; check shared NAT and abusive clients
      - eval_time: 25m
        alertname: ApiRateLimitSpike
        exp_alerts: []
  - name: ChatAuthFailureSpike 持续异常触发且恢复后清除
    interval: 1m
    input_series:
      - series: chat_auth_failures_total{reason="invalid_token"}
        values: 0+360x15 5400+0x20
    alert_rule_test:
      - eval_time: 1m
        alertname: ChatAuthFailureSpike
        exp_alerts: []
      - eval_time: 10m
        alertname: ChatAuthFailureSpike
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#chatauthfailurespike
              summary: Chat authentication failures exceed 5/s for 5m; investigate abuse or a client authentication regression
      - eval_time: 25m
        alertname: ChatAuthFailureSpike
        exp_alerts: []
  - name: 正常流量和短暂超预算不告警
    interval: 1m
    input_series:
      - series: circle_gateway_capacity_used{instance="blue",pool="http"}
        values: 0 120 0+0x18
      - series: circle_gateway_capacity_limit{instance="blue",pool="http"}
        values: 128+0x20
      - series: circle_gateway_rejections_total{instance="blue",pool="http",reason="capacity"}
        values: 0+1x20
      - series: http_requests_total{job="circle-be",status_code="401"}
        values: 0+1x20
      - series: http_requests_total{job="other-service",status_code="401"}
        values: 0+1000x20
      - series: http_requests_total{job="circle-be",status_code="429"}
        values: 0+1x20
      - series: chat_auth_failures_total{reason="invalid_token"}
        values: 0+1x20
      - series: circle_gateway_rejections_total{instance="blue",pool="chat_pending",reason="auth_timeout"}
        values: 0+1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: GatewayCapacityNearLimit
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayCapacityRejecting
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayAuthTimeoutSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: ApiAuthFailureSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: ApiRateLimitSpike
        exp_alerts: []
      - eval_time: 15m
        alertname: ChatAuthFailureSpike
        exp_alerts: []

  # ── 漏网的 promise rejection ─────────────────────────────────────────
  - name: 漏网 rejection 触发告警，15 分钟没有新增就消警
    interval: 1m
    input_series:
      - series: circle_unhandled_rejections_total{job="circle-be",instance="circle-be-blue"}
        values: 0x5 1+0x40
    alert_rule_test:
      - eval_time: 4m
        alertname: UnhandledRejectionsOccurring
        exp_alerts: []
      - eval_time: 7m
        alertname: UnhandledRejectionsOccurring
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#unhandledrejectionsoccurring
              summary: Backend caught unhandled promise rejection(s) in the last 15m — a missing .catch; see [unhandledRejection] log lines
      - eval_time: 30m
        alertname: UnhandledRejectionsOccurring
        exp_alerts: []

  # increase() 不把新序列的第一个样本当作从 0 起：新颜色在第一次被抓取前就漏出的
  # rejection，靠「15 分钟前还不存在的序列」那一段补上。
  - name: 新进程第一次被抓取时计数已经是 1，也要告警
    interval: 1m
    input_series:
      - series: circle_unhandled_rejections_total{job="circle-be",instance="circle-be-green"}
        values: 1+0x40
    alert_rule_test:
      - eval_time: 2m
        alertname: UnhandledRejectionsOccurring
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#unhandledrejectionsoccurring
              summary: Backend caught unhandled promise rejection(s) in the last 15m — a missing .catch; see [unhandledRejection] log lines
      - eval_time: 20m
        alertname: UnhandledRejectionsOccurring
        exp_alerts: []

  # ── 磁盘：两档各自独立触发，同盘抑制交给 Alertmanager ────────────────
  - name: 剩不到 5% 时 critical 与 warning 都触发
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 4+0x20
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 100+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 15m
        alertname: HostDiskNearlyFull
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostdisknearlyfull
              summary: Filesystem / below 5% free — database and log writes are about to fail
      - eval_time: 15m
        alertname: HostDiskFilling
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostdiskfilling
              summary: Filesystem / below 15% free

  - name: 剩 10% 只有 warning；只读挂载和 squashfs 都不算
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 10+0x20
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 100+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 0+0x20
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/mnt/restore",fstype="ext4"}
        values: 1+0x20
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/mnt/restore",fstype="ext4"}
        values: 100+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/mnt/restore",fstype="ext4"}
        values: 1+0x20
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/var/lib/snapd/snap/core",fstype="squashfs"}
        values: 0+0x20
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/var/lib/snapd/snap/core",fstype="squashfs"}
        values: 100+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/var/lib/snapd/snap/core",fstype="squashfs"}
        values: 1+0x20
    alert_rule_test:
      - eval_time: 15m
        alertname: HostDiskNearlyFull
        exp_alerts: []
      - eval_time: 15m
        alertname: HostDiskFilling
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostdiskfilling
              summary: Filesystem / below 15% free

  # ── 容器崩溃循环 ────────────────────────────────────────────────────
  # 按 cAdvisor 的真实形态造数据：同一个容器重启后 container_start_time_seconds
  # 的值（创建时间）不变，变的是 container_label_restartcount —— 每次一条新序列。
  - name: 同一个容器 15 分钟内重启 3 次算崩溃循环，停下来后消警
    interval: 1m
    input_series:
      - series: container_start_time_seconds{name="circle-be-minio-1",id="/docker/abc"}
        values: 100 100 100 _ _ _ _ _ _ _
      - series: container_start_time_seconds{name="circle-be-minio-1",id="/docker/abc",container_label_restartcount="1"}
        values: _ _ _ 100 100 _ _ _ _ _
      - series: container_start_time_seconds{name="circle-be-minio-1",id="/docker/abc",container_label_restartcount="2"}
        values: _ _ _ _ _ 100 100 _ _ _
      - series: container_start_time_seconds{name="circle-be-minio-1",id="/docker/abc",container_label_restartcount="3"}
        values: _ _ _ _ _ _ _ 100 100 100 100+0x30
    alert_rule_test:
      - eval_time: 5m
        alertname: ContainerRestartLoop
        exp_alerts: []
      - eval_time: 7m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              name: circle-be-minio-1
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#containerrestartloop
              summary: Container circle-be-minio-1 restarted about 3 times in 15m (crash loop or OOM kills?)
      - eval_time: 30m
        alertname: ContainerRestartLoop
        exp_alerts: []

  - name: 发版重建加一次手工重启、或单纯手工重启两次，都不算崩溃循环
    interval: 1m
    input_series:
      # 发版：旧容器消失、新容器是另一个 id；随后又手工 docker restart 了一次。
      - series: container_start_time_seconds{name="circle-be-caddy-1",id="/docker/old"}
        values: 100 100 100 _ _ _ _ _ _ _ _ _
      - series: container_start_time_seconds{name="circle-be-caddy-1",id="/docker/new"}
        values: _ _ _ 500 500 500 _ _ _ _ _ _
      - series: container_start_time_seconds{name="circle-be-caddy-1",id="/docker/new",container_label_restartcount="1"}
        values: _ _ _ _ _ _ 500 500 500 500 500 500
      # 另一个容器只被手工重启了两次（比如重载配置）。
      - series: container_start_time_seconds{name="circle-be-redis-1",id="/docker/r"}
        values: 200 200 200 200 _ _ _ _ _ _ _ _
      - series: container_start_time_seconds{name="circle-be-redis-1",id="/docker/r",container_label_restartcount="1"}
        values: _ _ _ _ 200 200 200 _ _ _ _ _
      - series: container_start_time_seconds{name="circle-be-redis-1",id="/docker/r",container_label_restartcount="2"}
        values: _ _ _ _ _ _ _ 200 200 200 200 200
    alert_rule_test:
      - eval_time: 11m
        alertname: ContainerRestartLoop
        exp_alerts: []

  # ── 备份自检 ────────────────────────────────────────────────────────
  - name: 某一项备份自检失败即 critical，并标出是哪一项
    interval: 1m
    input_series:
      - series: circle_backup_check_success{job="backup",instance="backup-metrics",check="postgres_archive"}
        values: 0+0x20
      - series: circle_backup_check_success{job="backup",instance="backup-metrics",check="destination_bucket"}
        values: 1+0x20
      - series: circle_backup_check_last_run_timestamp_seconds{job="backup",instance="backup-metrics"}
        values: 0+60x20
      - series: up{job="postgres-exporter",instance="postgres-exporter:9187"}
        values: 1+0x20
    alert_rule_test:
      - eval_time: 3m
        alertname: BackupCheckFailing
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupCheckFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: backup-metrics
              check: postgres_archive
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backupcheckfailing
              summary: Backup self-check postgres_archive is failing — see `docker compose logs backup`
      - eval_time: 10m
        alertname: BackupCheckStale
        exp_alerts: []
      - eval_time: 10m
        alertname: BackupCheckNotReporting
        exp_alerts: []

  - name: 自检停跑 3 小时后报 stale；一直在跑就不报
    interval: 1m
    input_series:
      # 最后一次完成在 t=0，之后时间戳不再前进（调度器挂了）。
      - series: circle_backup_check_last_run_timestamp_seconds{job="backup",instance="stopped"}
        values: 0+0x200
      # 每分钟都有一次完成（时间戳跟着时间走）。
      - series: circle_backup_check_last_run_timestamp_seconds{job="backup",instance="healthy"}
        values: 0+60x200
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupCheckStale
        exp_alerts: []
      - eval_time: 3h10m
        alertname: BackupCheckStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: stopped
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backupcheckstale
              summary: Backup self-check has not completed for 3h+ — the backup scheduler may be down

  - name: 生产上没有任何备份结果时，2 小时后报 not reporting
    interval: 1m
    input_series:
      - series: up{job="postgres-exporter",instance="postgres-exporter:9187"}
        values: 1+0x200
    alert_rule_test:
      - eval_time: 1h
        alertname: BackupCheckNotReporting
        exp_alerts: []
      - eval_time: 2h10m
        alertname: BackupCheckNotReporting
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backupchecknotreporting
              summary: No backup self-check results in production — backups are not deployed, or check.sh cannot write its metrics

  - name: 开发机（没有 postgres-exporter）上不报 not reporting
    interval: 1m
    input_series:
      - series: up{job="circle-be",instance="host.docker.internal:3000"}
        values: 1+0x200
    alert_rule_test:
      - eval_time: 3h
        alertname: BackupCheckNotReporting
        exp_alerts: []

  - name: 一次瞬时失败不报；连续两次失败才报 critical
    interval: 1m
    input_series:
      # 第 70 分钟那次检查碰上一次抖动，下一次就恢复了。
      - series: circle_backup_check_success{job="backup",instance="backup-metrics",check="destination_bucket"}
        values: 1+0x69 0+0x59 1+0x40
      # 第 70 分钟起每次都失败。
      - series: circle_backup_check_success{job="backup",instance="backup-metrics",check="minio_source"}
        values: 1+0x69 0+0x100
    alert_rule_test:
      - eval_time: 129m
        alertname: BackupCheckFailing
        exp_alerts: []
      - eval_time: 150m
        alertname: BackupCheckFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: backup-metrics
              check: minio_source
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backupcheckfailing
              summary: Backup self-check minio_source is failing — see `docker compose logs backup`

  - name: 检查一直在跑、却 30 小时都没有完成过一份备份
    interval: 2m
    input_series:
      - series: circle_backup_check_last_run_timestamp_seconds{job="backup",instance="never"}
        values: 0+120x1000
      - series: circle_backup_check_success{job="backup",instance="never",check="postgres_archive"}
        values: 1+0x1000
    alert_rule_test:
      - eval_time: 29h
        alertname: BackupNeverCompleted
        exp_alerts: []
      - eval_time: 30h10m
        alertname: BackupNeverCompleted
        exp_alerts:
          - exp_labels:
              severity: warning
              check: backup_freshness
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backupnevercompleted
              summary: Backup checks run, but the repository still has no completed backup after 30h — the base backup job is failing

  - name: 已有完成的备份时不报 never completed
    interval: 2m
    input_series:
      - series: circle_backup_check_last_run_timestamp_seconds{job="backup",instance="healthy"}
        values: 0+120x1000
      - series: circle_backup_check_success{job="backup",instance="healthy",check="backup_freshness"}
        values: 1+0x1000
    alert_rule_test:
      - eval_time: 31h
        alertname: BackupNeverCompleted
        exp_alerts: []

  # ── 外部投递通道 ────────────────────────────────────────────────────
  - name: JPush 全部可重试失败时按 provider 报；Expo 的失效 token 不算失败
    interval: 1m
    input_series:
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="jpush",result="retryable"}
        values: 0+60x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="jpush",result="sent"}
        values: 0+0x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="sent"}
        values: 0+600x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="dead_token"}
        values: 0+600x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="retryable"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 25m
        alertname: PushDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: jpush
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#pushdeliveryfailing
              summary: Over 20% of jpush push deliveries are failing — credentials, quota or provider outage?

  - name: 推送量太小时一两次失败不报
    interval: 1m
    input_series:
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="retryable"}
        values: 0x10 2+0x30
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="sent"}
        values: 0x10 3+0x30
    alert_rule_test:
      # 22m：跳变还在 15 分钟窗口里，且失败率超阈值已满 for 10m —— 只有
      # 最小样本量挡着。
      - eval_time: 22m
        alertname: PushDeliveryFailing
        exp_alerts: []

  - name: 验证码邮件大多失败时 critical
    interval: 1m
    input_series:
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="failure"}
        values: 0+1x40
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="success"}
        values: 0+0x40
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="unavailable"}
        values: 0+0x40
    alert_rule_test:
      - eval_time: 20m
        alertname: EmailCodeSendFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#emailcodesendfailing
              summary: Most verification-code emails are failing — users cannot register or sign in by email code

  - name: 生产上没配 SMTP（unavailable）同样算失败
    interval: 1m
    input_series:
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="unavailable"}
        values: 0x5 4+0x30
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="success"}
        values: 0+0x35
    alert_rule_test:
      - eval_time: 15m
        alertname: EmailCodeSendFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#emailcodesendfailing
              summary: Most verification-code emails are failing — users cannot register or sign in by email code

  - name: 偶发一封失败不报（失败率 100%，但只有一封）
    interval: 1m
    input_series:
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="failure"}
        values: 0x10 1+0x30
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-blue",result="success"}
        values: 0+0x40
    alert_rule_test:
      # 18m：那封失败还在窗口里，失败率已满 for 5m —— 只有最小失败数挡着。
      - eval_time: 18m
        alertname: EmailCodeSendFailing
        exp_alerts: []

  - name: 失败占少数时不报
    interval: 1m
    input_series:
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-green",result="failure"}
        values: 0+1x40
      - series: circle_email_code_sends_total{job="circle-be",instance="circle-be-green",result="success"}
        values: 0+3x40
    alert_rule_test:
      - eval_time: 25m
        alertname: EmailCodeSendFailing
        exp_alerts: []

  - name: 推送失败率 30% 就报，10% 不报
    interval: 1m
    input_series:
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="retryable"}
        values: 0+30x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="expo",result="sent"}
        values: 0+70x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="jpush",result="rejected"}
        values: 0+10x40
      - series: circle_push_deliveries_total{job="circle-be",instance="circle-be-blue",provider="jpush",result="sent"}
        values: 0+90x40
    alert_rule_test:
      - eval_time: 25m
        alertname: PushDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              provider: expo
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#pushdeliveryfailing
              summary: Over 20% of expo push deliveries are failing — credentials, quota or provider outage?

  # ── 间隔很短的任务：心跳阈值不能低于抓取与求值的粒度 ────────────────
  # 5 秒一跑的任务，3 × 周期 = 15 秒，而抓取和求值都是 15 秒一次：正常运转时
  # 求值看到的心跳也会滞后 12～18 秒。没有下限的话这条会周期性地连响几小时。
  - name: 5 秒任务的正常心跳滞后不报 stalled；真停了才报
    interval: 15s
    input_series:
      # 每次抓取时心跳都落后 18 秒（抓取相位最差的情况）。
      - series: circle_cron_last_success_timestamp_seconds{job="circle-be",exported_job="admin_group_operation"}
        values: -18+15x80
      - series: circle_cron_interval_seconds{job="circle-be",exported_job="admin_group_operation"}
        values: 5+0x80
      # 另一个 10 秒任务从 t=0 起就停了。
      - series: circle_cron_last_success_timestamp_seconds{job="circle-be",exported_job="group_admission_delivery"}
        values: 0+0x80
      - series: circle_cron_interval_seconds{job="circle-be",exported_job="group_admission_delivery"}
        values: 10+0x80
    alert_rule_test:
      - eval_time: 19m
        alertname: CronJobStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              exported_job: group_admission_delivery
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#cronjobstalled
              summary: Scheduled job group_admission_delivery has not succeeded in 3x its interval

  # ── 第三批：发版异地备份、依赖失败率、存储可达性、磁盘趋势、inode ─────
  - name: 发版时的异地备份失败就报，下次成功后消警
    interval: 1m
    input_series:
      - series: circle_release_offsite_backup_success{job="backup",instance="backup-metrics"}
        values: 0x20 1x20
    alert_rule_test:
      - eval_time: 10m
        alertname: ReleaseOffsiteBackupFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: backup-metrics
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#releaseoffsitebackupfailed
              summary: The last release-time off-host database backup failed — see ~/circle_be_backups/.offsite-status on the host
      - eval_time: 30m
        alertname: ReleaseOffsiteBackupFailed
        exp_alerts: []

  - name: 对象存储服务端读写大面积失败时按依赖报；not_found 和 LiveKit 偶发失败不报
    interval: 1m
    input_series:
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="object_storage",operation="PutObject",result="failure"}
        values: 0+2x40
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="object_storage",operation="PutObject",result="success"}
        values: 0+2x40
      # 大量「对象不存在」是存储审计的正常结果，不能把失败率拉高。
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="livekit",operation="create_room",result="not_found"}
        values: 0+50x40
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="livekit",operation="create_room",result="failure"}
        values: 0x10 2+0x30
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="livekit",operation="create_room",result="success"}
        values: 0x10 2+0x30
    alert_rule_test:
      - eval_time: 25m
        alertname: DependencyRequestsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              dependency: object_storage
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#dependencyrequestsfailing
              summary: Over 20% of backend requests to object_storage are failing — credentials, bucket policy or an outage?

  - name: 任一在服务的实例连不上对象存储就 critical
    interval: 1m
    input_series:
      - series: circle_object_store_up{job="circle-be",instance="circle-be-blue"}
        values: 1+0x20
      - series: circle_object_store_up{job="circle-be",instance="circle-be-green"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 3m
        alertname: ObjectStoreUnreachable
        exp_alerts: []
      - eval_time: 10m
        alertname: ObjectStoreUnreachable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#objectstoreunreachable
              summary: Object storage is unreachable — media uploads and reads are failing for every user

  - name: 按当前写入速度 24 小时内会写满就报
    interval: 1m
    input_series:
      # 剩 30%，每分钟少 1 —— 24 小时后远低于 0。
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 300-1x200
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 1000+0x200
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 0+0x200
    alert_rule_test:
      - eval_time: 50m
        alertname: HostDiskWillFillWithin24h
        exp_alerts: []
      - eval_time: 2h
        alertname: HostDiskWillFillWithin24h
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostdiskwillfillwithin24h
              summary: Filesystem / is on track to fill within 24h at the current write rate

  - name: 平稳的盘、和下降中但还很空的盘都不报趋势
    interval: 1m
    input_series:
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 300+0x200
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 1000+0x200
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 0+0x200
      # 剩 80% 还在降：一次大文件写入就能让斜率短暂为负，不值得叫人。
      - series: node_filesystem_avail_bytes{instance="node-exporter:9100",mountpoint="/data",fstype="ext4"}
        values: 800-1x200
      - series: node_filesystem_size_bytes{instance="node-exporter:9100",mountpoint="/data",fstype="ext4"}
        values: 1000+0x200
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/data",fstype="ext4"}
        values: 0+0x200
    alert_rule_test:
      - eval_time: 2h
        alertname: HostDiskWillFillWithin24h
        exp_alerts: []

  - name: inode 剩 5% 只报 warning；剩 2% 两档都在 Prometheus 侧触发；btrfs 不算
    interval: 1m
    input_series:
      - series: node_filesystem_files_free{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 5+0x20
      - series: node_filesystem_files{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 100+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/",fstype="ext4"}
        values: 0+0x20
      - series: node_filesystem_files_free{instance="node-exporter:9100",mountpoint="/var/lib/docker",fstype="xfs"}
        values: 2+0x20
      - series: node_filesystem_files{instance="node-exporter:9100",mountpoint="/var/lib/docker",fstype="xfs"}
        values: 100+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/var/lib/docker",fstype="xfs"}
        values: 0+0x20
      # btrfs 动态分配 inode，总数报 0。
      - series: node_filesystem_files_free{instance="node-exporter:9100",mountpoint="/srv",fstype="btrfs"}
        values: 0+0x20
      - series: node_filesystem_files{instance="node-exporter:9100",mountpoint="/srv",fstype="btrfs"}
        values: 0+0x20
      - series: node_filesystem_readonly{instance="node-exporter:9100",mountpoint="/srv",fstype="btrfs"}
        values: 0+0x20
    alert_rule_test:
      - eval_time: 15m
        alertname: HostInodesLow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              mountpoint: /
              fstype: ext4
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostinodeslow
              summary: Filesystem / has less than 10% of its inodes left
          - exp_labels:
              severity: warning
              instance: node-exporter:9100
              mountpoint: /var/lib/docker
              fstype: xfs
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostinodeslow
              summary: Filesystem /var/lib/docker has less than 10% of its inodes left
      - eval_time: 15m
        alertname: HostInodesNearlyExhausted
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: node-exporter:9100
              mountpoint: /var/lib/docker
              fstype: xfs
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#hostinodesnearlyexhausted
              summary: Filesystem /var/lib/docker is almost out of inodes — new files (logs, uploads, WAL) will fail to be created

  - name: LiveKit 只失败两次（失败率 100%）不报 —— 最小失败数挡着
    interval: 1m
    input_series:
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="livekit",operation="create_room",result="failure"}
        values: 0x5 2+0x30
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="livekit",operation="create_room",result="success"}
        values: 0+0x35
    alert_rule_test:
      # 18m：两次失败还在窗口里，失败率已满 for 10m。
      - eval_time: 18m
        alertname: DependencyRequestsFailing
        exp_alerts: []

  - name: 可达性探测的 HeadBucket 不能把服务端写入失败的比例稀释掉
    interval: 1m
    input_series:
      # /readyz 和抓取每分钟约 2 次 HeadBucket，全部成功。
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="object_storage",operation="HeadBucket",result="success"}
        values: 0+2x40
      # 桶策略拒掉了服务端拷贝：15 分钟里只有 6 次，次次失败。
      - series: circle_dependency_requests_total{job="circle-be",instance="circle-be-blue",dependency="object_storage",operation="CopyObject",result="failure"}
        values: 0x5 6+0x35
    alert_rule_test:
      - eval_time: 18m
        alertname: DependencyRequestsFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              dependency: object_storage
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#dependencyrequestsfailing
              summary: Over 20% of backend requests to object_storage are failing — credentials, bucket policy or an outage?

  # ── 版本、合成探测、钱包对账、恢复演练、Postgres 锁与回卷、通话 ──────────────
  - name: 蓝绿两色跑不同构建超过 30 分钟才报，发版切换时的短暂并存不报
    interval: 1m
    input_series:
      - series: circle_build_info{job="circle-be",instance="circle-be-blue",version="v1.0.0",commit="aaaaaaaaaaaa"}
        values: 1x60
      - series: circle_build_info{job="circle-be",instance="circle-be-green",version="v1.0.1",commit="bbbbbbbbbbbb"}
        values: 1x60
      - series: circle_build_info{job="circle-be",instance="circle-be-blue",version="v1.1.0",commit="cccccccccccc"}
        values: _x70 1x60
      - series: circle_build_info{job="circle-be",instance="circle-be-green",version="v1.1.1",commit="dddddddddddd"}
        values: _x70 1x10
    alert_rule_test:
      - eval_time: 31m
        alertname: BackendVersionSkew
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backendversionskew
              summary: Backend instances have been running different builds for 30m — a blue-green release did not finish
      - eval_time: 100m
        alertname: BackendVersionSkew
        exp_alerts: []

  - name: 合成探测 15 分钟没有一轮走通就报；重启后从未成功也照样报
    interval: 1m
    input_series:
      - series: circle_synthetic_probe_configured{job="synthetic-probe",instance="synthetic-probe"}
        values: 1x30
      # 进程启动时播种的 last_success（时刻 0），之后再没成功过。
      - series: circle_synthetic_probe_last_success_timestamp_seconds{job="synthetic-probe",instance="synthetic-probe"}
        values: 0x30
    alert_rule_test:
      - eval_time: 14m
        alertname: SyntheticProbeFailing
        exp_alerts: []
      - eval_time: 18m
        alertname: SyntheticProbeFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: synthetic-probe
              instance: synthetic-probe
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#syntheticprobefailing
              summary: The synthetic probe account has not completed login → API → realtime for 15m
              description: 'Failing step and reason: circle_synthetic_probe_failures_total; probe logs: event synthetic_probe_run.'

  - name: 合成探测每轮都成功不报；没配测试号一小时后提醒
    interval: 1m
    input_series:
      - series: circle_synthetic_probe_configured{job="synthetic-probe",instance="synthetic-probe"}
        values: 1x40
      - series: circle_synthetic_probe_last_success_timestamp_seconds{job="synthetic-probe",instance="synthetic-probe"}
        values: 0+60x40
      - series: circle_synthetic_probe_configured{job="synthetic-probe",instance="probe-unconfigured"}
        values: 0x70
    alert_rule_test:
      - eval_time: 40m
        alertname: SyntheticProbeFailing
        exp_alerts: []
      - eval_time: 61m
        alertname: SyntheticProbeNotConfigured
        exp_alerts:
          - exp_labels:
              severity: warning
              job: synthetic-probe
              instance: probe-unconfigured
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#syntheticprobenotconfigured
              summary: The synthetic probe is running without credentials — fill in .env.synthetic-probe and restart it

  - name: 钱包对账发现不一致后，进程重启导致序列消失也不误恢复；对账恢复一致才消警
    interval: 1m
    input_series:
      - series: circle_wallet_reconciliation_violations{job="circle-be",instance="circle-be-blue",check="ledger_mismatch"}
        values: 2 _x119 0x10
      - series: circle_wallet_reconciliation_violations{job="circle-be",instance="circle-be-blue",check="negative_balance"}
        values: 0 _x119 0x10
    alert_rule_test:
      - eval_time: 1m
        alertname: WalletLedgerMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              check: ledger_mismatch
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#walletledgermismatch
              summary: Wallet reconciliation found 2 wallet(s) failing ledger_mismatch — balances disagree with the coin ledger
      # 中间两小时没有样本（重启后还没到下一次对账）：仍在报。
      - eval_time: 90m
        alertname: WalletLedgerMismatch
        exp_alerts:
          - exp_labels:
              severity: critical
              check: ledger_mismatch
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#walletledgermismatch
              summary: Wallet reconciliation found 2 wallet(s) failing ledger_mismatch — balances disagree with the coin ledger
      - eval_time: 125m
        alertname: WalletLedgerMismatch
        exp_alerts: []

  - name: 演练失败立即 critical 并标出停在哪一步；太久没通过另报 warning
    interval: 1m
    input_series:
      - series: circle_backup_drill_success{job="backup",instance="backup-metrics",stage="restore"}
        values: 0x80
      # 上一次通过是 8 天又 100 秒之前。
      - series: circle_backup_drill_last_success_timestamp_seconds{job="backup",instance="backup-metrics"}
        values: -691300+0x80
    alert_rule_test:
      - eval_time: 1m
        alertname: BackupRestoreDrillFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: backup
              instance: backup-metrics
              stage: restore
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backuprestoredrillfailing
              summary: The last restore drill failed at stage restore — see `docker compose logs backup`
      - eval_time: 61m
        alertname: BackupRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: backup
              instance: backup-metrics
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#backuprestoredrillstale
              summary: No restore drill has passed for 8 days — is the drill scheduled (BACKUP_JOBS) and running?

  - name: 开了 5 分钟以上的事务持续 5 分钟才报；autovacuum 与空闲连接不算
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="idle in transaction",usename="circle",application_name="",backend_type="client backend",wait_event_type="Client",wait_event="ClientRead"}
        values: 400+60x20
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="active",usename="postgres",application_name="",backend_type="autovacuum worker",wait_event_type="",wait_event=""}
        values: 9000x20
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="idle",usename="circle",application_name="",backend_type="client backend",wait_event_type="Client",wait_event="ClientRead"}
        values: 9000x20
      # 发版前的 pg_dump 与恢复演练的计数查询本来就是长事务。
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="active",usename="circle",application_name="pg_dump",backend_type="client backend",wait_event_type="",wait_event=""}
        values: 9000x20
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="active",usename="circle",application_name="circle-restore-drill",backend_type="client backend",wait_event_type="",wait_event=""}
        values: 9000x20
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresLongTransaction
        exp_alerts: []
      - eval_time: 6m
        alertname: PostgresLongTransaction
        exp_alerts:
          - exp_labels:
              severity: warning
              datname: circle
              state: idle in transaction
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgreslongtransaction
              summary: A transaction in circle (idle in transaction) has been open for more than 5m

  - name: 卡在锁上一分钟以上、持续两分钟才报；短暂的咨询锁排队不报
    interval: 1m
    input_series:
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="active",usename="circle",application_name="",backend_type="client backend",wait_event_type="Lock",wait_event="advisory"}
        values: 90+60x10
      - series: pg_stat_activity_count{datname="circle",state="active",usename="circle",application_name="",backend_type="client backend",wait_event_type="Lock",wait_event="advisory"}
        values: 2 6x10
      - series: pg_stat_activity_max_tx_duration{datname="circle",state="active",usename="circle",application_name="",backend_type="client backend",wait_event_type="Lock",wait_event="transactionid"}
        # 只在一次抓取里出现：下一次抓取时这组会话已经没了，序列立即失效。
        values: 70 stale
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresLockWaitStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              datname: circle
              wait_event: advisory
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgreslockwaitstuck
              summary: Sessions in circle have been waiting on a advisory lock for over a minute
      - eval_time: 5m
        alertname: PostgresLockPileUp
        exp_alerts:
          - exp_labels:
              severity: warning
              datname: circle
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgreslockpileup
              summary: 6 sessions in circle are queued on locks

  - name: 回卷两档与采集项缺失
    interval: 1m
    input_series:
      - series: pg_database_wraparound_age_datfrozenxid_seconds{datname="circle"}
        values: 600000000x70
      - series: pg_database_wraparound_age_datminmxid_seconds{datname="circle"}
        values: 1000x70
      - series: pg_database_wraparound_age_datfrozenxid_seconds{datname="template1"}
        values: 1600000000x70
      - series: pg_database_wraparound_age_datminmxid_seconds{datname="template1"}
        values: 1000x70
      - series: pg_up{instance="postgres-exporter"}
        values: 1x70
    alert_rule_test:
      - eval_time: 61m
        alertname: PostgresXidWraparoundRisk
        exp_alerts:
          - exp_labels:
              severity: warning
              datname: circle
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgresxidwraparoundrisk
              summary: Transaction ID age in circle is far above the autovacuum freeze threshold
          - exp_labels:
              severity: warning
              datname: template1
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgresxidwraparoundrisk
              summary: Transaction ID age in template1 is far above the autovacuum freeze threshold
      - eval_time: 11m
        alertname: PostgresXidWraparoundImminent
        exp_alerts:
          - exp_labels:
              severity: critical
              datname: template1
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgresxidwraparoundimminent
              summary: Transaction ID age in template1 is approaching wraparound — Postgres will stop accepting writes
      - eval_time: 61m
        alertname: PostgresWraparoundMetricsMissing
        exp_alerts: []

  - name: exporter 在跑却没有回卷指标，一小时后报
    interval: 1m
    input_series:
      - series: pg_up{instance="postgres-exporter"}
        values: 1x70
    alert_rule_test:
      - eval_time: 61m
        alertname: PostgresWraparoundMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgreswraparoundmetricsmissing
              summary: postgres-exporter is up but exports no wraparound metrics — recreate it with --collector.database_wraparound

  - name: 死锁出现即报
    interval: 1m
    input_series:
      - series: pg_stat_database_deadlocks{datid="16384",datname="circle"}
        values: 0x5 1x10
    alert_rule_test:
      - eval_time: 7m
        alertname: PostgresDeadlocks
        exp_alerts:
          - exp_labels:
              severity: warning
              datname: circle
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#postgresdeadlocks
              summary: Postgres detected deadlocks in circle in the last 15m

  - name: 通话发起与接听的服务端失败超过两成才报，且要有最低通话量
    interval: 1m
    input_series:
      - series: circle_call_setups_total{kind="direct",result="started"}
        values: 0+1x30
      - series: circle_call_setups_total{kind="direct",result="livekit_unavailable"}
        values: 0+1x30
      - series: circle_call_setups_total{kind="direct",result="busy"}
        values: 0x30
      - series: circle_call_accepts_total{kind="direct",result="accepted"}
        values: 0+1x30
      - series: circle_call_accepts_total{kind="direct",result="failed"}
        values: 0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: CallSetupFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#callsetupfailing
              summary: Over 20% of call starts and answers are failing on the server (LiveKit unavailable or errors)

  - name: 低通话量下一两通失败不报
    interval: 1m
    input_series:
      - series: circle_call_setups_total{kind="direct",result="started"}
        values: 0x10 1+0x20
      - series: circle_call_setups_total{kind="direct",result="failed"}
        values: 0x10 2+0x20
      - series: circle_call_accepts_total{kind="direct",result="accepted"}
        values: 0x30
    alert_rule_test:
      - eval_time: 20m
        alertname: CallSetupFailing
        exp_alerts: []

  - name: 接通的电话大多 10 秒内结束才报
    interval: 1m
    input_series:
      - series: circle_call_answered_duration_seconds_bucket{kind="direct",le="10"}
        values: 0+1x40
      - series: circle_call_answered_duration_seconds_count{kind="direct"}
        values: 0+1x40
      - series: circle_call_answered_duration_seconds_bucket{kind="group",le="10"}
        values: 0x40
      - series: circle_call_answered_duration_seconds_count{kind="group"}
        values: 0+1x40
    alert_rule_test:
      # 两种通话合计：一半 10 秒内结束，不到六成，不报。
      - eval_time: 25m
        alertname: CallsEndingTooQuickly
        exp_alerts: []

  - name: 接通的电话几乎全在 10 秒内结束
    interval: 1m
    input_series:
      - series: circle_call_answered_duration_seconds_bucket{kind="direct",le="10"}
        values: 0+1x40
      - series: circle_call_answered_duration_seconds_count{kind="direct"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 25m
        alertname: CallsEndingTooQuickly
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#callsendingtooquickly
              summary: Most answered calls in the last 30m ended within 10s — media connections are probably failing

  - name: LiveKit 回调全被拒才报；有正常回调时的零星被拒是扫描器
    interval: 1m
    input_series:
      - series: circle_call_livekit_webhooks_total{result="rejected"}
        values: 0+1x40
      - series: circle_call_livekit_webhooks_total{result="handled"}
        values: 0x20 0+1x20
      - series: circle_call_livekit_webhooks_total{result="failed"}
        values: 0x20 1+0x20
    alert_rule_test:
      - eval_time: 10m
        alertname: LiveKitWebhookRejected
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#livekitwebhookrejected
              summary: Every LiveKit webhook in the last 30m failed signature checks — do LIVEKIT_API_KEY / LIVEKIT_API_SECRET match the LiveKit project?
      - eval_time: 40m
        alertname: LiveKitWebhookRejected
        exp_alerts: []
      - eval_time: 22m
        alertname: LiveKitWebhookFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              runbook_url: https://github.com/CircleTeamHub/circle_be/blob/main/docs/runbooks/alerts.md#livekitwebhookfailing
              summary: Signed LiveKit webhooks are failing to process — room_finished events are being lost
