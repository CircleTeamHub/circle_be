global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # The optional logs overlay mounts targets into this otherwise-empty path.
  # No target series exists in metrics-only installs, so optional services do
  # not create false TargetDown alerts when the overlay is disabled.
  - job_name: logs-pipeline
    file_sd_configs:
      - files: ['/etc/prometheus/log-targets/*.yml']

  # The circle_be backend running on the host. Restart the backend on the new
  # code first, or this target shows DOWN (old build has no /metrics).
  - job_name: circle-be
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
