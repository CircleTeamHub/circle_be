# perfetto 原生堆剖析配置：附加到正在运行的预发包，记录附加之后分配、到结束时仍未释放的内存。
# 用法（包必须是 profileable 的）：
#   adb shell perfetto --txt -c - -o /data/misc/perfetto-traces/heap.pftrace < heapprofd.cfg
#   adb pull /data/misc/perfetto-traces/heap.pftrace
buffers {
  size_kb: 131072
  fill_policy: DISCARD
}
data_sources {
  config {
    name: "android.heapprofd"
    heapprofd_config {
      sampling_interval_bytes: 4096
      process_cmdline: "com.yiboding.circleim.preprod"
      shmem_size_bytes: 16777216
      block_client: true
    }
  }
}
duration_ms: 150000
